/* Kontextbezogene Bereiche für die Jetzt-Seite: höchstens drei.
   Das ist eine Navigationshilfe, keine Behauptung, was du tun müsstest. */
function relevant(){
  const ph=phase(), out=[];
  const M=meds();
  if(M.some(m=>!medTaken(DAY,m.id)) && (ph==='morning'||ph==='midday')) out.push('med');
  const n=hausNext(); if(n && (ph==='midday'||ph==='evening')) out.push('haus');
  if(S.fin.wish.some(w=>w.status==='warten'&&Date.now()>=w.bis)) out.push('fin');
  if(S.inbox.length>=3) out.push('inbox');
  if(ph==='winddown'||ph==='night') out.push('journal');
  if(ph==='dip') out.push('fokus');
  const d=new Date().getDay(); if(d===0&&(ph==='evening'||ph==='winddown')) out.push('week');
  if(S.beschw.some(b=>b.offen)) out.push('beschw');
  return [...new Set(out)].slice(0,3).map(k=>AREAS.find(a=>a.k===k));
}

function hausDone(day,id){ return !!(S.haus.done[day]||{})[id]; }
window.hausTick=(id)=>{ const m=S.haus.done[DAY]=S.haus.done[DAY]||{};
  m[id]=true; rotateStyle(); save(); render(); toast('Erledigt'); };
window.hausSkip=(id)=>{ const m=S.haus.done[DAY]=S.haus.done[DAY]||{};
  m[id]='skip'; rotateStyle(); save(); render(); };
window.hausReopen=(id)=>{ const m=S.haus.done[DAY]||{}; delete m[id]; save(); render(); };

/* Wählt den nächsten Schritt: genau einen. Maik soll nicht entscheiden müssen,
   womit er anfängt — das ist der teuerste Schritt. */
function hausNext(){
  if(S.haus.rescue[DAY]){
    const s=RESCUE.find(x=>!hausDone(DAY,x.id+'@'+DAY));
    return s?{s, quelle:'Rettungsmodus', key:s.id+'@'+DAY}:null;
  }
  if(S.haus.reset.active){
    const blk=RESET.find(b=>b.d===S.haus.reset.day);
    if(blk){ const s=blk.steps.find(x=>!hausDone('reset',x.id));
      if(s) return {s, quelle:'Grundreset Tag '+blk.d+' — '+blk.n, key:s.id, reset:true};
    }
  }
  const z=S.haus.zone||'zimmer', Z=ZONE[z];
  const budget=S.haus.size==='min'?3:S.haus.size==='catch'?30:10;
  const s=Z.steps.find(x=>!hausDone(DAY,x.id) && !(x.opt && S.haus.size==='min') && x.min<=budget+6);
  if(!s){ const any=Z.steps.find(x=>!hausDone(DAY,x.id)); if(any) return {s:any, quelle:Z.n, key:any.id}; return null; }
  return {s, quelle:Z.n, key:s.id};
}

function rhyDue(k){ const last=S.haus.last[k]; const r=RHY.find(x=>x.k===k);
  const d=(S.haus.rhythm[k]||r.d);
  if(!last) return {due:true, tage:null, d};
  const diff=Math.round((parseISO(todayISO())-parseISO(last))/864e5);
  return {due:diff>=d, tage:diff, d}; }

  h+=`<div class="card">

  h+=`<div class="card">

      Experiment mit Ergebnismaß, keine belegte Methode.</div></div>
  <div style="height:20px"></div>`;
  return h;
}

/* =========================================================================
   FOKUS — Timer, Ablenkungsparkplatz, stilles Body Doubling
   Body Doubling ist Evidenzstufe C/D: eine Befragungs- und Designstudie mit
   220 neurodivergenten Teilnehmenden, kein Wirksamkeits-RCT.
   ========================================================================= */
let TIMER=null, TEND=0, TLAB='';
window.startFocus=(min,lab)=>{
  TEND=Date.now()+min*60000; TLAB=lab||'Fokus';
  clearInterval(TIMER); TIMER=setInterval(tickFocus,1000); tickFocus();
  openSheet(focusSheet());
};
function tickFocus(){
  const el=document.getElementById('fClock'); if(!el){ return; }
  const left=Math.max(0,TEND-Date.now());
  el.textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left/1000)%60);
  if(left<=0){ clearInterval(TIMER); TIMER=null;
    el.textContent='00:00';
    const b=document.getElementById('fEnd'); if(b) b.style.display='block'; }
}
function focusSheet(){
  const bd=S.fokus.bd||'still';
  return `<h2>${esc(TLAB)}</h2>
  <div class="clock" id="fClock">--:--</div>
  <div class="xs muted" style="text-align:center;margin-bottom:14px">
    ${bd==='still'?'Stille Begleitung — kein Ton, keine Unterbrechung.'
      :bd==='check'?'Kurze Check-ins am Anfang und am Ende.':'Nur der Timer.'}</div>
  <label class="f"><span>Ablenkungsparkplatz — Gedanke rein, ohne aufzuhören</span>
    <input type="text" id="fPark" placeholder="Waschmittel kaufen…"
      onkeydown="if(event.key==='Enter')park()"></label>
  <button class="btn" onclick="park()">Parken</button>
  <div class="card tight" id="fParked" style="margin-top:12px">${parkedList()}</div>
  <div class="spacer"></div>
  <div id="fEnd" style="display:none">
    <div class="btnrow">
      <button class="btn acc" onclick="endFocus('done')">Fertig</button>
      <button class="btn" onclick="endFocus('part')">Teilweise</button>
      <button class="btn ghost" onclick="endFocus('other')">Anders gelaufen</button></div>
    <div class="note">„Teilweise“ zählt als Fortschritt. Es gibt hier keine Serie, die kaputtgehen kann.</div>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost sm" onclick="stopFocus()">Abbrechen</button>`;
}
/* Vorher wurde der ganze Sheet-Inhalt neu geschrieben — dabei verschwand das
   Eingabefeld und mit ihm die Tastatur. Jetzt bleibt das Feld stehen und nur die
   Liste darunter wächst. Mehrere Gedanken hintereinander ohne Unterbrechung. */
window.park=()=>{ const e=document.getElementById('fPark'); if(!e) return;
  const v=e.value.trim(); if(!v) return;
  S.fokus.park.push({t:v, ts:Date.now()}); save();
  e.value=''; e.focus();
  const box=document.getElementById('fParked');
  if(box) box.innerHTML=parkedList();
  toast('Geparkt'); };

/* =========================================================================
   MEDIKAMENTE — Dokumentation und Vorbereitung eines Fachgesprächs.
   Die App ändert nie eine Dosis, empfiehlt nie einen Wechsel und erfindet
   nach einer vergessenen Einnahme keine Anweisung.
   ========================================================================= */
const MED_DEF=[
  {id:'elv', n:'Elvanse', wirk:'Lisdexamfetamin', zeit:'08:15', stock:0, pack:30, puffer:7},
  {id:'esc', n:'Escitalopram', wirk:'Escitalopram', zeit:'08:15', stock:0, pack:30, puffer:7}
];
function meds(){ if(!S.med.items){ S.med.items=structuredClone(MED_DEF); save(); } return S.med.items; }
const medTaken=(d,id)=>!!(S.med.taken[d]||{})[id];
window.medTick=id=>{ const m=S.med.taken[DAY]=S.med.taken[DAY]||{};
  if(m[id]){ delete m[id]; } else { m[id]=new Date().toTimeString().slice(0,5);
    const it=meds().find(x=>x.id===id); if(it && it.stock>0) it.stock--; }
  save(); render(); };
window.medSet=(id,k,v)=>{ const it=meds().find(x=>x.id===id); if(!it) return;
  it[k]=(k==='stock'||k==='pack'||k==='puffer')?parseInt(v||0,10):v;
  if(k==='stock') it.erfasst=true;
  save(); render(); };
window.medRefill=id=>{ const it=meds().find(x=>x.id===id); if(!it) return;
  it.stock=(it.stock||0)+(it.pack||30); it.erfasst=true;
  save(); render(); toast('Packung gebucht'); };

/* Reichweite in Tagen; Nachfüllpuffer statt Alarm am letzten Tag.
   Ein nie erfasster Bestand ist kein Notfall — eine Warnung, die falsch losgeht,
   wird als erste ignoriert und nimmt allen echten Warnungen die Wirkung. */
function medRange(it){ const s=it.stock||0;
  return {tage:s, unbekannt:s===0 && !it.erfasst, warn: s>0 && s<=(it.puffer||7)}; }

function vMed(){
  const M=meds();
  const lastW=S.med.week[S.med.week.length-1];
  const lastB=S.med.biweek[S.med.biweek.length-1];
  const dW=lastW?Math.round((parseISO(todayISO())-parseISO(lastW.d))/864e5):null;
  const dB=lastB?Math.round((parseISO(todayISO())-parseISO(lastB.d))/864e5):null;
  let h='';

  if(!S.med.seenSafety){
    h+=`<div class="card" style="border-color:var(--amber)">
      <h2 style="color:var(--amber)">Einmalige Sicherheitsinformation</h2>
      <div class="small" style="line-height:1.7;margin-bottom:11px">
        Escitalopram wirkt serotonerg. Die Fachinformation von Lisdexamfetamin nennt bei
        gleichzeitiger Gabe serotonerger Arzneimittel ein erhöhtes Risiko für ein Serotoninsyndrom.
        <b>Das heißt nicht, dass deine verordnete Kombination falsch ist</b> — sie ist ärztlich
        gewählt und wird ärztlich überwacht. Es heißt, dass du wissen solltest, worauf zu achten ist.
        <br><br>Anzeichen, die nicht auf den Wochenbericht warten: plötzliche Unruhe oder Verwirrtheit,
        Muskelzucken oder -steifigkeit, starkes Schwitzen, Fieber, Herzrasen, Durchfall, Zittern.
        Dann ärztliche Hilfe — nicht diese App.</div>
      <button class="btn" onclick="S.med.seenSafety=true;save();render()">Gelesen</button>
      <div class="note">Quelle: Fachinformation Lisdexamfetamin und Escitalopram. Diese App
        bewertet deine Kombination nicht und fordert nie zum Absetzen auf.</div></div>`;
  }

  h+=`<div class="card">
    <h2>Heute</h2>
    ${M.map(it=>{const t=medTaken(DAY,it.id); const r=medRange(it);
      return `<div class="item">
        <button class="tick ${t?'on':''}" onclick="medTick('${it.id}')">${t?'&#10003;':''}</button>
        <div class="g"><b>${esc(it.n)}</b>
          <span>geplant ${esc(it.zeit)}${t?' · genommen '+esc((S.med.taken[DAY]||{})[it.id]):''}</span></div>
        <div class="v" style="${r.warn?'color:var(--amber)':r.unbekannt?'color:var(--dim);font-weight:400;font-size:12px':''}">${r.unbekannt?'Bestand?':r.tage+' Tage'}</div>
      </div>`;}).join('')}
    <div class="note">Wenn eine Einnahme ausgefallen ist, sagt diese App bewusst nichts dazu.
      Was dann gilt, steht in deiner Packungsinformation oder kommt von deiner Ärztin —
      keine eigenmächtige Doppel- oder Ersatzdosis.</div>
  </div>`;

  M.forEach(it=>{ const r=medRange(it);
    h+=`<div class="card">
      <div class="row between" style="margin-bottom:8px">
        <h2 style="margin:0">${esc(it.n)}</h2>
        ${r.warn?`<span class="tag" style="background:#33210f;color:#fcd34d">nachfüllen</span>`:''}</div>
      <div class="inline">
        <label class="f"><span>Bestand (Tage)</span>
          <input type="number" value="${it.stock||0}" onchange="medSet('${it.id}','stock',this.value)"></label>
        <label class="f"><span>Packung</span>
          <input type="number" value="${it.pack||30}" onchange="medSet('${it.id}','pack',this.value)"></label>
        <label class="f"><span>Puffer</span>
          <input type="number" value="${it.puffer||7}" onchange="medSet('${it.id}','puffer',this.value)"></label>
      </div>
      <label class="f"><span>Geplante Einnahmezeit</span>
        <input type="time" value="${esc(it.zeit)}" onchange="medSet('${it.id}','zeit',this.value)"></label>
      <button class="btn sm" onclick="medRefill('${it.id}')">Packung erhalten (+${it.pack||30})</button>
      ${r.warn?`<div class="warn">Noch ${r.tage} Tage. Rezept jetzt anstoßen, nicht am letzten Tag —
        der Puffer ist genau dafür da.</div>`
       :r.unbekannt?`<div class="note">Bestand noch nicht erfasst. Trag einmal ein, für wie viele
        Tage die Packung reicht — danach zählt die App selbst herunter.</div>`:''}
    </div>`;
  });

  h+=`<div class="card">
    <h2>Rückblick</h2>
    <div class="item"><div class="g"><b>Wochencheck</b>
      <span>1–2 Minuten${dW!=null?` · zuletzt vor ${dW} Tagen`:' · noch nie'}</span></div>
      <button class="btn sm ${dW==null||dW>=7?'acc':''}" onclick="openSheet(medWeekSheet())">Starten</button></div>
    <div class="item"><div class="g"><b>Zwei-Wochen-Rückblick</b>
      <span>3–5 Minuten${dB!=null?` · zuletzt vor ${dB} Tagen`:' · noch nie'}</span></div>
      <button class="btn sm ${dB==null||dB>=14?'acc':''}" onclick="openSheet(medBiSheet())">Starten</button></div>
    <div class="note">Zwei Ebenen statt täglicher Befragung. Tägliches Abfragen von Wirkung und
      Nebenwirkung erzeugt selbst Belastung und liefert nicht mehr Information.</div>
  </div>`;

  if(S.med.week.length){
    h+=`<div class="card"><h2>Letzte Wochenchecks</h2>
      ${S.med.week.slice(-6).reverse().map(w=>`<div class="item"><div class="g">
        <b style="font-weight:520">${human(w.d)}</b>
        <span>${w.aus>0?w.aus+' Auslassungen · ':''}Wirkung ${esc(w.wirkung||'—')} · Schlaf ${esc(w.schlaf||'—')}</span></div>
        ${w.neben?`<span class="tag">Nebenwirkung</span>`:''}</div>`).join('')}
    </div>`;
  }
  if(S.med.biweek.length){
    const b=S.med.biweek[S.med.biweek.length-1];
    h+=`<div class="card"><h2>Fürs nächste Gespräch</h2>
      <div class="small muted" style="line-height:1.7">${esc(b.fragen||'Keine offenen Fragen notiert.')}</div>
      <div class="spacer"></div>
      <button class="btn sm" onclick="medBericht()">Zusammenfassung anzeigen</button>
      <div class="note">Bleibt auf deinem Bildschirm. Wird nicht verschickt und nicht freigegeben —
        du zeigst sie selbst, wenn du willst.</div></div>`;
  }

  h+=`<div class="card tight">${evTag('A')}
    <div class="small muted" style="margin-top:8px">NICE NG87 und NG222 stützen strukturiertes
      Monitoring von Wirkung, Nebenwirkungen, Schlaf, Gewicht und Adhärenz. Sie stützen nicht,
      dass eine App daraus eine Behandlungsentscheidung ableitet. Diese Seite dokumentiert und
      bereitet vor — mehr nicht.</div></div>
  <div style="height:20px"></div>`;
  return h;
}

  <label class="f"><span>Ausgelassene Einnahmen diese Woche</span>

window.finSet=(k,v)=>{ S.fin[k]=parseFloat(v)||0; save(); render(); };

/* Impulskauf-Check: die 40-Euro- und 21-Uhr-Regeln sind persönliche
   Schutzregeln, keine klinischen Normwerte. */
window.kaufCheck=()=>openSheet(kaufSheet());
function kaufSheet(){
  return `<h2>Kurz prüfen</h2>
  <label class="f"><span>Was?</span><input type="text" id="kN" autofocus></label>
  <label class="f"><span>Preis (€)</span><input type="number" step="0.01" id="kP"></label>
  <label class="f"><span>Geplant gewesen?</span>
    <select id="kG"><option value="0">nein, spontan</option><option value="1">ja, stand schon fest</option></select></label>
  <button class="btn acc" onclick="kaufEval()">Prüfen</button>`;
}
window.kaufEval=()=>{
  const n=document.getElementById('kN').value.trim()||'Kauf';
  const p=parseFloat(document.getElementById('kP').value)||0;
  const geplant=document.getElementById('kG').value==='1';
  const h=new Date().getHours();
  const nacht=h>=(S.fin.nightFrom||21)||h<5;
  const gross=p>=(S.fin.limit||40);
  const stop=!geplant&&(gross||nacht);
  let gruende=[];
  if(!geplant&&gross) gruende.push(`Über deiner Grenze von ${S.fin.limit||40} €, und nicht geplant.`);
  if(!geplant&&nacht) gruende.push(`Nach ${S.fin.nightFrom||21} Uhr — deine Regel sagt: heute nichts Ungeplantes.`);
  openSheet(`<h2>${esc(n)}${p?` · ${r1(p)} €`:''}</h2>
  ${stop?`<div class="card" style="border-color:var(--amber);margin-bottom:12px">
      <div class="small" style="line-height:1.7">${gruende.map(g=>'· '+esc(g)).join('<br>')}
      <br><br><b>Vorschlag:</b> Foto oder Barcode speichern, Warenkorb oder Geschäft jetzt verlassen.
      Morgen steht es auf der Wunschliste, und du entscheidest ohne den Moment.</div></div>
    <button class="btn acc" onclick="wishAdd('${esc(n).replace(/'/g,'')}',${p})">Auf die Wunschliste, 24 Stunden</button>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="kaufLog('${esc(n).replace(/'/g,'')}',${p},'trotzdem')">Ich kaufe es trotzdem</button>`
   :`<div class="card tight" style="border-color:var(--acc);margin-bottom:12px">
      <div class="small">${geplant?'Das stand fest. Keine Reibung nötig.':'Unter deiner Grenze und nicht spät. Passt.'}</div></div>
    <button class="btn acc" onclick="kaufLog('${esc(n).replace(/'/g,'')}',${p},'gekauft')">Erledigt</button>`}
  <div class="note">Diese Regeln sind deine, nicht die der Wissenschaft. Selbstbindung und
    Zugriffshürden sind als Strategieklasse belegt; eine bestimmte Wartezeit oder Eurogrenze ist es
    nicht. ${Q('impuls')}</div>`);
};
window.kaufLog=(n,p,st)=>{ S.fin.log.push({ts:Date.now(),n,betrag:p,st}); save(); closeSheet(); render(); };
window.wishAdd=(n,p)=>{ S.fin.wish.push({id:uid(), n, preis:p, ts:Date.now(),
  bis:Date.now()+864e5, status:'warten'}); save(); closeSheet(); render(); toast('Auf der Wunschliste'); };
window.wishDo=(id,st)=>{ const w=S.fin.wish.find(x=>x.id===id); if(!w) return;
  w.status=st; if(st==='gekauft') S.fin.log.push({ts:Date.now(),n:w.n,betrag:w.preis,st:'nach Wartezeit'});
  save(); render(); };
window.billAdd=()=>{ S.fin.bills.push({id:uid(), n:'Rechnung', betrag:0, faellig:todayISO(), bezahlt:false});
  save(); render(); };
window.billSet=(id,k,v)=>{ const b=S.fin.bills.find(x=>x.id===id); if(!b) return;
  b[k]=k==='betrag'?(parseFloat(v)||0):v; save(); };
window.billPay=id=>{ const b=S.fin.bills.find(x=>x.id===id); if(b){ b.bezahlt=!b.bezahlt; save(); render(); } };
window.billDel=id=>{ S.fin.bills=S.fin.bills.filter(x=>x.id!==id); save(); render(); };

function vFin(){
  const wReif=S.fin.wish.filter(w=>w.status==='warten'&&Date.now()>=w.bis);
  const wWart=S.fin.wish.filter(w=>w.status==='warten'&&Date.now()<w.bis);
  const offen=S.fin.bills.filter(b=>!b.bezahlt).sort((a,b)=>a.faellig<b.faellig?-1:1);
  const monat=S.fin.log.filter(x=>Date.now()-x.ts<30*864e5);
  let h=`<div class="card">
    <button class="btn acc" onclick="kaufCheck()">Etwas kaufen? Kurz prüfen</button>
    <div class="grid2" style="margin-top:10px">
      <label class="f" style="margin:0"><span>Grenze für Spontankäufe (€)</span>
        <input type="number" value="${S.fin.limit||40}" onchange="finSet('limit',this.value)"></label>
      <label class="f" style="margin:0"><span>Ab welcher Uhrzeit nichts Ungeplantes</span>
        <input type="number" value="${S.fin.nightFrom||21}" onchange="finSet('nightFrom',this.value)"></label>
    </div></div>`;

  if(wReif.length) h+=`<div class="card" style="border-color:var(--acc)">
    <h2>Wartezeit vorbei — jetzt entscheiden</h2>
    ${wReif.map(w=>`<div class="item"><div class="g"><b>${esc(w.n)}</b>
      <span>${r1(w.preis)} € · seit ${human(iso(new Date(w.ts)))}</span></div>
      <button class="btn sm acc" onclick="wishDo('${w.id}','gekauft')">Kaufen</button>
      <button class="btn sm ghost" onclick="wishDo('${w.id}','verworfen')">Lassen</button></div>`).join('')}
  </div>`;

  if(wWart.length) h+=`<div class="card"><h2>Wunschliste (wartet)</h2>
    ${wWart.map(w=>{const std=Math.ceil((w.bis-Date.now())/36e5);
      return `<div class="item"><div class="g"><b>${esc(w.n)}</b>
        <span>${r1(w.preis)} € · noch ${std} h</span></div></div>`;}).join('')}
  </div>`;

  h+=`<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Töpfe und Konten</h2>
      <button class="btn sm ghost" onclick="kontoAdd()">+</button></div>
    ${S.fin.konten.length?S.fin.konten.map(c=>`<div class="item">
      <div class="g"><input type="text" value="${esc(c.n)}" onchange="kontoSet('${c.id}','n',this.value)"
        style="background:transparent;border:none;padding:0;font-weight:600;font-size:14.5px"></div>
      <input type="number" step="0.01" value="${c.betrag}" onchange="kontoSet('${c.id}','betrag',this.value)"
        style="width:100px;text-align:right">
      <button class="x" onclick="kontoDel('${c.id}')">✕</button></div>`).join('')
     :`<div class="small muted">Stände trägst du von Hand ein. Keine Bankanbindung — die wäre eine
       eigene Sicherheitsentscheidung und gehört nicht in die erste Fassung.</div>`}
    ${S.fin.konten.length?`<div class="hr"></div>
      <div class="row between"><span class="small muted">Summe</span>
        <b class="mono">${r1(sum(S.fin.konten.map(c=>c.betrag)))} €</b></div>`:''}
  </div>

  <div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Fälligkeiten${offen.length?` · ${offen.length} offen`:''}</h2>
      <button class="btn sm ghost" onclick="billAdd()">+</button></div>
    ${S.fin.bills.length?S.fin.bills.map(b=>{
      const spaet=!b.bezahlt&&b.faellig<todayISO();
      return `<div class="item" style="${spaet?'border-color:#63430f':''}">
      <button class="tick ${b.bezahlt?'on':''}" onclick="billPay('${b.id}')">${b.bezahlt?'&#10003;':''}</button>
      <div class="g"><input type="text" value="${esc(b.n)}" onchange="billSet('${b.id}','n',this.value)"
        style="background:transparent;border:none;padding:0;font-weight:600;font-size:14px">
        <input type="date" value="${b.faellig}" onchange="billSet('${b.id}','faellig',this.value)"
          style="background:transparent;border:none;padding:0;font-size:11.5px;color:var(--muted)"></div>
      <input type="number" step="0.01" value="${b.betrag}" onchange="billSet('${b.id}','betrag',this.value)"
        style="width:86px;text-align:right">
      <button class="x" onclick="billDel('${b.id}')">✕</button></div>`;}).join('')
     :`<div class="small muted">Rechnungen, Abos, Fristen.</div>`}

  if(monat.length) h+=`<div class="card"><h2>Geprüfte Käufe (30 Tage)</h2>
    ${monat.slice(-10).reverse().map(x=>`<div class="item"><div class="g">
      <b style="font-weight:520">${esc(x.n)}</b><span>${esc(x.st)}</span></div>

  h+=`<div class="card tight">${evTag('B')}
    <div class="small muted" style="margin-top:8px">Selbstbindung, Budgets und Zugriffshürden sind als
      Strategieklasse in einer Meta-Analyse über 29 Experimente gestützt. Dass ADHS mit schwierigeren
      Finanzentscheidungen einhergeht, ist in Beobachtungsstudien gezeigt — eine geprüfte
      ADHS-Finanz-App gibt es nicht. Deine 40 € und deine 21 Uhr sind Setzungen, keine Normwerte.</div></div>
  <div style="height:20px"></div>`;
  return h;
}

/* =========================================================================
   REFLEXION — Aufbau nach Liven: Stimmung, Gefühle, Körperempfindungen,
   Kontext, Freitext. Eine Frage pro Schritt, überall Mehrfachauswahl,
   und jede Liste um eigene Begriffe erweiterbar.

   Die alte Fassung (drei feste Fragen) hat Maik nichts gebracht — sie fragte
   nach einer Bewertung des Tages, statt beim Erfassen des Moments zu helfen.
   ========================================================================= */

const MOODS=[
  {v:-2, n:'Furchtbar', c:'#e05252'},
  {v:-1, n:'Nicht gut', c:'#e0894f'},
  {v: 0, n:'Neutral',   c:'#8b93b5'},
  {v: 1, n:'Gut',       c:'#54b57a'},
  {v: 2, n:'Großartig', c:'#3fa9d8'}
];
const moodOf=v=>MOODS.find(m=>m.v===v)||MOODS[2];

/* Gefühlslisten nach Valenz — sonst muss Maik bei „gut" durch fünfzehn
   negative Begriffe scrollen, und genau das bricht die Zehn-Sekunden-Regel. */
const FEEL={
  '-2':['Überfordert','Wütend','Ängstlich','Verzweifelt','Einsam','Beschämt','Schuldig',
        'Gereizt','Erschöpft','Hilflos','Traurig','Leer'],
  '-1':['Unruhig','Genervt','Unzufrieden','Angespannt','Unkonzentriert','Enttäuscht',
        'Unsicher','Müde','Gestresst','Unmotiviert','Nervös','Frustriert'],
  '0' :['Beschäftigt','Entspannt','Friedvoll','Gelangweilt','Gleichgültig','Müde',
        'Ruhig','Taub','Traurig','Unmotiviert','Verloren','Zufrieden'],
  '1' :['Zufrieden','Motiviert','Wach','Konzentriert','Gelassen','Dankbar','Verbunden',
        'Stolz','Erleichtert','Klar','Zuversichtlich','Ausgeglichen'],
  '2' :['Euphorisch','Stark','Voller Energie','Begeistert','Frei','Verliebt','Stolz',
        'Unbesiegbar','Dankbar','Ausgelassen','Selbstsicher','Im Flow']
};
const SENS=['Anspannung','Kopfschmerzen','Wärme','Schmerz','Erschöpfung','Offenheit',
  'Kribbeln','Müdigkeit','Enge in der Brust','Verkrampftheit','Unruhe in den Beinen',
  'Magendrücken','Kloß im Hals','Leichtigkeit','Schwere','Herzklopfen','Nichts Besonderes'];
const DOING=['Selbstgespräch','Studium','Aufgaben','Hobbys','Pendeln','Auf dem Balkon',
  'Trainieren','Handball','Im Bett liegen','Handy','Essen','Haushalt','Zocken','Serie',
  'Autofahren','Nichts'];
const WITHW=['Allein','Evi','Familie','Freunde','Mannschaft','Kollegen','Haustier','Fremde'];
const WHERE=['Zu Hause','Zimmer','Draußen','Gym','Halle','Uni','Unterwegs','Bei Evi','Auto'];

/* Eigene Begriffe. Maik hat in Liven genau das benutzt („Auf dem balkon sitzen",
   „starke anspannung/ druc") — ohne diese Möglichkeit passt die Liste nie. */
function jOpts(){ if(!S.jOpts) S.jOpts={feel:[],sens:[],doing:[],withw:[],where:[]};
  return S.jOpts; }
function optList(k,mood){
  const base = k==='feel' ? FEEL[String(mood)] : k==='sens' ? SENS
             : k==='doing'? DOING : k==='withw'? WITHW : WHERE;
  return [...base, ...(jOpts()[k]||[])];
}
window.jAddOpt=k=>{ const v=prompt('Eigener Eintrag:'); if(!v||!v.trim()) return;
  jOpts()[k].push(v.trim()); save(); jPick(k,v.trim()); };

/* ---- Ablauf: fünf Schritte, einer pro Bildschirm ---- */
let JD=null, JSTEP=0;
window.jStart=()=>{ JD={ts:Date.now(), mood:0, feel:[], sens:[], doing:[], withw:[], where:[], text:''};
  JSTEP=0; VIEW='journal'; render(); window.scrollTo(0,0); };
window.jCancel=()=>{ JD=null; JSTEP=0; render(); };
window.jMood=v=>{ JD.mood=v; render(); };
window.jPick=(k,v)=>{ const a=JD[k], i=a.indexOf(v);
  if(i<0) a.push(v); else a.splice(i,1); render(); };
window.jNext=()=>{ if(JSTEP===4){ jSave(); return; }
  if(JSTEP===4-1){ /* Freitext kommt als Letztes */ }
  JSTEP++; render(); window.scrollTo(0,0); };
window.jBack=()=>{ if(JSTEP===0){ jCancel(); return; } JSTEP--; render(); window.scrollTo(0,0); };
window.jText=v=>{ if(JD) JD.text=v; };
function jSave(){
  const t=document.getElementById('jTxt'); if(t) JD.text=t.value;
  const d=S.journal[DAY];
  /* Ältere Fassung speicherte ein Objekt mit drei Feldern. Nicht verlieren. */
  const list = Array.isArray(d) ? d : (d && (d.gut||d.schwer||d.morgen||d.frei))
    ? [{ts:0, mood:0, feel:[], sens:[], doing:[], withw:[], where:[],
        text:[d.gut,d.schwer,d.morgen,d.frei].filter(Boolean).join('\n')}]
    : [];
  list.push(JD); S.journal[DAY]=list; save();
  JD=null; JSTEP=0; render(); toast('Eingetragen');
}
function jEntries(d){ const x=S.journal[d];
  if(Array.isArray(x)) return x;
  if(x && (x.gut||x.schwer||x.morgen||x.frei)) return [{ts:0, mood:0, feel:[], sens:[],
    doing:[], withw:[], where:[], text:[x.gut,x.schwer,x.morgen,x.frei].filter(Boolean).join('\n')}];
  return [];
}

function chipBlock(k,mood,label){
  const list=optList(k,mood);
  return `${label?`<div class="jlab">${label}</div>`:''}
    <div class="chips" style="margin-bottom:14px">
      <button class="pill" onclick="jAddOpt('${k}')" style="font-weight:700">+</button>
      ${list.map(v=>`<button class="pill ${JD[k].includes(v)?'on':''}"
        onclick="jPick('${k}','${esc(v).replace(/'/g,'')}')">${esc(v)}</button>`).join('')}
    </div>`;
}

function jWizard(){
  const m=moodOf(JD.mood);
  const kopf=(t,s)=>`<div class="jhead"><h2 class="jq">${t}</h2>
    ${s?`<div class="small muted" style="margin-top:4px">${s}</div>`:''}</div>`;
  let h='';
  if(JSTEP===0){
    h+=kopf('Wie fühlst du dich gerade?');
    h+=`<div class="moodwrap">
      <div class="moodball" style="--mc:${m.c}"></div>
      <div class="moodname" style="color:${m.c}">${m.n}</div></div>
    <div class="row between xs muted" style="margin:0 2px 6px">
      <span>Furchtbar</span><span>Neutral</span><span>Großartig</span></div>
    <input type="range" min="-2" max="2" step="1" value="${JD.mood}" class="moodrange"
      oninput="jMood(+this.value)">`;
  }
  else if(JSTEP===1){
    h+=kopf(`Welche Gefühle haben dich <b style="color:${m.c}">${m.n.toLowerCase()}</b> fühlen lassen?`,
            'Wähle alles, was zutrifft. Auch nichts ist eine Antwort.');
    h+=chipBlock('feel',JD.mood);
  }
  else if(JSTEP===2){
    h+=kopf('Welche Empfindungen gehen damit einher?','Im Körper, nicht im Kopf.');
    h+=chipBlock('sens',JD.mood);
  }
  else if(JSTEP===3){
    h+=kopf(`Ich fühle mich <b style="color:${m.c}">${m.n.toLowerCase()}</b>`,
            'Erforsche, was dich beeinflusst.');
    h+=chipBlock('doing',JD.mood,'Was machst du gerade?');
    h+=chipBlock('withw',JD.mood,'Mit wem bist du?');
    h+=chipBlock('where',JD.mood,'Wo bist du?');
  }
  else {
    h+=kopf('Was hast du auf dem Herzen?','Freiwillig. Ein Satz reicht, keiner auch.');
    h+=`<textarea id="jTxt" rows="7" placeholder="Beginne zu schreiben …"
      style="font-size:16px;line-height:1.6">${esc(JD.text||'')}</textarea>`;
  }
  h+=`<div class="spacer"></div>
  <button class="btn acc" onclick="jNext()">${JSTEP===4?'Eintragen':'Weiter'}</button>
  <div class="spacer"></div>
  <button class="btn ghost sm" onclick="jBack()">${JSTEP===0?'Abbrechen':'Zurück'}</button>
  <div class="jdots">${[0,1,2,3,4].map(i=>`<i class="${i<=JSTEP?'on':''}"></i>`).join('')}</div>`;
  return h;
}

function entryCard(e,d){
  const m=moodOf(e.mood||0);
  const alle=[...(e.feel||[]),...(e.sens||[])];
  const kontext=[...(e.doing||[]),...(e.withw||[]),...(e.where||[])];
  const zeit=e.ts?new Date(e.ts).toTimeString().slice(0,5):'';
  return `<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <div class="row" style="gap:9px">
        <span class="mdot" style="background:${m.c}"></span>
        <b style="font-size:15px">${m.n}</b></div>
      <span class="xs muted mono">${d?human(d)+' · ':''}${zeit}</span></div>
    ${alle.length?`<div class="chips" style="margin-bottom:${kontext.length||e.text?'9px':'0'}">
      ${alle.map(x=>`<span class="pill xs">${esc(x)}</span>`).join('')}</div>`:''}
    ${kontext.length?`<div class="xs muted" style="margin-bottom:${e.text?'9px':'0'}">
      ${kontext.map(esc).join(' · ')}</div>`:''}
    ${e.text?`<div class="small" style="white-space:pre-wrap;line-height:1.6">${esc(e.text)}</div>`:''}
  </div>`;
}

/* Muster über 14 Tage — aber erst, wenn genug Einträge da sind.
   Vorher wäre jede „Erkenntnis" geraten. */
function jPattern(){
  const tage=Object.keys(S.journal).sort().slice(-14);
  const alle=tage.flatMap(d=>jEntries(d));
  if(alle.length<8) return {n:alle.length, genug:false};
  const zaehl=(k)=>{ const c={};
    alle.forEach(e=>(e[k]||[]).forEach(v=>c[v]=(c[v]||0)+1));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4); };
  const tief=alle.filter(e=>(e.mood||0)<0);
  const kontextTief={};
  tief.forEach(e=>[...(e.doing||[]),...(e.where||[])].forEach(v=>kontextTief[v]=(kontextTief[v]||0)+1));
  return {n:alle.length, genug:true,
    schnitt: alle.reduce((a,e)=>a+(e.mood||0),0)/alle.length,
    feel: zaehl('feel'), sens: zaehl('sens'),
    tief: Object.entries(kontextTief).sort((a,b)=>b[1]-a[1]).slice(0,3),
    tiefN: tief.length};
}

function vJournal(){
  if(JD) return jWizard();
  const heute=jEntries(DAY);
  const p=jPattern();
  const letzte=Object.keys(S.journal).sort().reverse().filter(d=>d!==DAY).slice(0,5);
  let h=`<div class="card tight">
    <button class="btn acc" onclick="jStart()">Wie fühlst du dich gerade?</button>
    <div class="note">Fünf kurze Schritte, jederzeit abbrechbar. Mehrmals am Tag ist normal —
      es geht um den Moment, nicht um eine Tagesbilanz.</div></div>`;

  if(heute.length){ h+=`<h2 class="sect">Heute · ${heute.length}</h2>`;
    h+=heute.slice().reverse().map(e=>entryCard(e)).join(''); }

  if(p.genug){
    const ms=moodOf(Math.round(p.schnitt));
    h+=`<div class="card">
      <h2>Muster der letzten 14 Tage</h2>
      <div class="row" style="gap:10px;margin-bottom:11px">
        <span class="mdot" style="background:${ms.c}"></span>
        <div><b>Im Schnitt ${ms.n.toLowerCase()}</b>
          <div class="xs muted">${p.n} Einträge, davon ${p.tiefN} im Minus</div></div></div>
      ${p.feel.length?`<div class="xs muted" style="margin-bottom:4px">Häufigste Gefühle</div>
        <div class="chips" style="margin-bottom:11px">
        ${p.feel.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}</span></span>`).join('')}</div>`:''}
      ${p.sens.length?`<div class="xs muted" style="margin-bottom:4px">Häufigste Körperempfindungen</div>
        <div class="chips" style="margin-bottom:11px">
        ${p.sens.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}</span></span>`).join('')}</div>`:''}
      ${p.tief.length?`<div class="xs muted" style="margin-bottom:4px">Wobei es dir schlechter ging</div>
        <div class="chips">${p.tief.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}×</span></span>`).join('')}</div>`:''}
      <div class="note">Das sind Häufigkeiten, keine Ursachen. Was oft zusammen auftritt, muss
        einander nicht auslösen — aber es ist der Ort, an dem du nachsehen kannst.</div>
    </div>`;
  } else if(p.n>0){
    h+=`<div class="card tight"><div class="small muted">Noch ${8-p.n} Einträge, dann zeigt die
      App Muster über die letzten vierzehn Tage. Vorher wäre jede Aussage geraten.</div></div>`;
  }

  if(letzte.length){ h+=`<h2 class="sect">Früher</h2>`;
    letzte.forEach(d=>{ jEntries(d).slice().reverse().forEach(e=>{ h+=entryCard(e,d); }); }); }
  h+='<div style="height:20px"></div>';
  return h;
}

/* =========================================================================
   NOTFALLKNOPF — sofortige Verhaltensunterbrechung, keine Achtsamkeitsübung.

   Maiks Vorgabe: kein Zähler, keine Serie, kein Protokoll. Ein Druck, EINE
   Option, und beim nächsten Mal eine andere. Es geht nicht um Moral, sondern
   darum, in dem Moment auf andere Gedanken zu kommen.

   Grundlage ist Abschnitt 5.2 seines Vier-Wochen-Resets („ADHS-Notfallliste
   für schnelles Dopamin"), erweitert. Leitsatz von dort:
   „Der Punkt ist nicht perfekte Achtsamkeit, sondern sofortige
   Verhaltensunterbrechung."
   ========================================================================= */
const NOT_FIX=[
  /* aus seiner eigenen Liste */
  {t:'Fünf Minuten zügig gehen', s:'Raus, um den Block. Tempo, bei dem du nicht mehr singen könntest.', g:'bewegen'},
  {t:'Zwanzig Kniebeugen', s:'Sofort, wo du stehst. Zählen laut mitsprechen.', g:'bewegen'},
  {t:'Push-ups bis es unangenehm wird', s:'Nicht bis zum Maximum. Bis es anstrengend ist.', g:'bewegen'},
  {t:'Kaltes Wasser ins Gesicht', s:'Und über die Unterarme. Dreißig Sekunden.', g:'reiz'},
  {t:'Kopfhörer auf, einmal durch die Wohnung', s:'Etwas Lautes. Nicht sitzen bleiben.', g:'reiz'},

function notDynamic(){
  const out=[];
  const t=tasksFor(DAY).find(x=>!x.done);
  if(t) out.push({t:'Deine Aufgabe: '+t.t, g:'nutzen',
    s:t.first?('Kleinster Start: '+t.first):'Nur anfangen, nicht fertig machen.'});
  const hx=(typeof hausNext==='function')?hausNext():null;
  if(hx) out.push({t:'Haushalt: '+hx.s.t, s:`${hx.quelle} · etwa ${hx.s.min} Minuten.`, g:'nutzen'});
  const w=windowsFor(DAY).find(x=>x.status==='now');
  if(w) out.push({t:w.n+' — jetzt wäre das Fenster', s:`Ziel ${w.kcal} kcal, ${w.prot} g Protein.`, g:'nutzen'});
  const inb=S.inbox.filter(x=>!/^app\s*:/i.test(x.t));
  if(inb.length) out.push({t:'Aus dem Eingang: '+inb[0].t, s:'Lag da und wartet.', g:'nutzen'});
  if(!sessionsOn(DAY).length) out.push({t:'Ins Gym', s:'Heute noch keine Einheit erfasst.', g:'bewegen'});
  return out;
}

  for(let i=6;i>=0;i--){ const d=addDays(DAY,-i); out.push((S.smoke[d]||[]).length); } return out; }
function smokeTop(){ const c={};
  Object.values(S.smoke).flat().forEach(x=>{ if(!x.tr) return;
    /* "Pause + Langeweile" zählt für beide, sonst zerfällt die Statistik in Einzelfälle */
    String(x.tr).split(' + ').forEach(t=>{ t=t.trim(); if(t) c[t]=(c[t]||0)+1; }); });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3); }

function weekNums(){
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(DAY,-i));
  const ses=days.flatMap(d=>sessionsOn(d));
  const fenster=days.reduce((a,d)=>{ const m=S.adhs.meals[d]||{};
    return a+Object.values(m).filter(v=>v==='done').length; },0);
  const checks=days.filter(d=>hooper(d)!=null).length;
  const zig=days.reduce((a,d)=>a+(S.smoke[d]||[]).length,0);
  const dr=days.reduce((a,d)=>a+(S.drills[d]||[]).length,0);
  const last=sum(days.map(d=>loadOn(d)));
  return {days, ses:ses.length, fenster, checks, zig, dr, last};
}

window.claudeBericht=()=>{
  const w=weekNums(), M=meds();
  const L=[];
  L.push('Pivot-Bericht · '+human(todayISO()));
  L.push('');
  L.push(`Training: ${w.ses} Einheiten, Wochenlast ${w.last} sRPE`);
  const st=weekStats(DAY);
  if(st) L.push(`Monotonie ${r1(st.mono)}, Strain ${r0(st.strain)}`);
  L.push(`Tages-Checks: ${w.checks}/7${hooper(DAY)!=null?`, heute Hooper ${hooper(DAY)}`:''}`);
  L.push(`Essensfenster erfüllt: ${w.fenster}/28`);
  L.push(`Drills: ${w.dr} · Zigaretten: ${w.zig}`);
  const bw=S.beschw.filter(b=>b.offen);
  if(bw.length) L.push('Beschwerden offen: '+bw.map(b=>b.ort+(b.verlauf.length?` (${b.verlauf[b.verlauf.length-1].score}/100)`:'')).join(', '));
  const lowStock=M.filter(m=>medRange(m).warn);
  if(lowStock.length) L.push('Medikamentenbestand knapp: '+lowStock.map(m=>m.n).join(', '));
  const top=smokeTop(); if(top.length) L.push('Häufigster Auslöser: '+top[0][0]+' ('+top[0][1]+'×)');
  if(S.week.lief) L.push('Lief: '+S.week.lief);
  if(S.week.vergessen) L.push('Untergegangen: '+S.week.vergessen);
  /* Bekannte Lücke aus V5: Eingang und Parkplatz fehlten im Bericht, obwohl genau
     dort steht, was Maik über die App und über sich notiert hat. */
  const appNotes=S.inbox.filter(x=>/^app\s*:/i.test(x.t));
  const rest=S.inbox.filter(x=>!/^app\s*:/i.test(x.t));
  if(appNotes.length){ L.push('', 'Zur App ('+appNotes.length+'):');
    appNotes.forEach(x=>L.push('  - '+x.t.replace(/^app\s*:\s*/i,''))); }
  if(rest.length){ L.push('', 'Eingang ('+rest.length+'):');
    rest.forEach(x=>L.push('  - '+x.t)); }
  if(S.fokus.park.length){ L.push('', 'Ablenkungsparkplatz ('+S.fokus.park.length+'):');
    S.fokus.park.forEach(x=>L.push('  - '+x.t)); }
  const txt=L.join('\n');
  openSheet(`<h2>Bericht</h2>
    <textarea rows="14" readonly style="font-size:12.5px;line-height:1.6">${esc(txt)}</textarea>
    <div class="spacer"></div>
    <button class="btn acc" onclick="copyTxt(this)" data-t="${esc(txt)}">Kopieren</button>`);
};

function applyTheme(){
  const hell = S.seen.theme==='light';
  if(hell) document.body.dataset.theme='light';
  else document.body.removeAttribute('data-theme');
  /* Die Palette liegt auf <body>, der Bereich unter der Seite gehört aber <html> —
     ohne das bleibt am Seitenende ein dunkles Band stehen. */
  document.documentElement.style.background = hell ? '#f2f5f9' : '';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', hell?'#f2f5f9':'#0b0d10');
}
window.setP=(k,v)=>{ S.profile[k]=(k==='sex'||k==='goal')?v:parseFloat(v); save();
  if(VIEW==='me') render(); };
window.delFav=i=>{ S.foods.splice(i,1); save(); render(); };
window.expo=()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='pivot-backup-'+todayISO()+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  S.seen.lastExport=Date.now(); save(); render(); toast('Export erstellt');
};
window.impo=inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.profile) throw 0;
      S=deepMerge(structuredClone(DEF),d); save(); render(); toast('Import erfolgreich'); }
    catch(e){ toast('Datei nicht lesbar'); } };
  r.readAsText(f); inp.value='';
};

/* =========================================================================
   START
   ========================================================================= */
applyTheme();
if(S.seen.ver && S.seen.ver!==APP_VERSION) S.seen.updated=1;
if(S.seen.ver!==APP_VERSION){ S.seen.ver=APP_VERSION; save(); }
render();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopScan(); flush(); } });
</script>
</body>
