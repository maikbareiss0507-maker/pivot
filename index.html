window.billDel=id=>{ S.fin.bills=S.fin.bills.filter(x=>x.id!==id); save(); render(); };

function vFin(){
  const wReif=S.fin.wish.filter(w=>w.status==='warten'&&Date.now()>=w.bis);
  const wWart=S.fin.wish.filter(w=>w.status==='warten'&&Date.now()<w.bis);
  const offen=S.fin.bills.filter(b=>!b.bezahlt).sort((a,b)=>a.faellig<b.faellig?-1:1);
  const monat=S.fin.log.filter(x=>Date.now()-x.ts<30*864e5);
  let h=`<div class="card">
    <button class="btn acc" onclick="kaufCheck()">Etwas kaufen? Kurz prüfen</button>
    <div class="grid2" style="margin-top:10px">
      <label class="f" style="margin:0"><span>Grenze für Spontankäufe (€)</span>
        <input type="number" value="${S.fin.limit||40}" onchange="finSet('limit',this.value)"></label>
      <label class="f" style="margin:0"><span>Ab welcher Uhrzeit nichts Ungeplantes</span>
        <input type="number" value="${S.fin.nightFrom||21}" onchange="finSet('nightFrom',this.value)"></label>
    </div></div>`;

  if(wReif.length) h+=`<div class="card" style="border-color:var(--acc)">
    <h2>Wartezeit vorbei — jetzt entscheiden</h2>
    ${wReif.map(w=>`<div class="item"><div class="g"><b>${esc(w.n)}</b>
      <span>${r1(w.preis)} € · seit ${human(iso(new Date(w.ts)))}</span></div>
      <button class="btn sm acc" onclick="wishDo('${w.id}','gekauft')">Kaufen</button>
      <button class="btn sm ghost" onclick="wishDo('${w.id}','verworfen')">Lassen</button></div>`).join('')}
  </div>`;

  if(wWart.length) h+=`<div class="card"><h2>Wunschliste (wartet)</h2>
    ${wWart.map(w=>{const std=Math.ceil((w.bis-Date.now())/36e5);
      return `<div class="item"><div class="g"><b>${esc(w.n)}</b>
        <span>${r1(w.preis)} € · noch ${std} h</span></div></div>`;}).join('')}
  </div>`;

  h+=`<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Töpfe und Konten</h2>
      <button class="btn sm ghost" onclick="kontoAdd()">+</button></div>
    ${S.fin.konten.length?S.fin.konten.map(c=>`<div class="item">
      <div class="g"><input type="text" value="${esc(c.n)}" onchange="kontoSet('${c.id}','n',this.value)"
        style="background:transparent;border:none;padding:0;font-weight:600;font-size:15px"></div>
      <input type="number" step="0.01" value="${c.betrag}" onchange="kontoSet('${c.id}','betrag',this.value)"
        style="width:100px;text-align:right">
      <button class="x" onclick="kontoDel('${c.id}')">✕</button></div>`).join('')
     :`<div class="small muted">Stände trägst du von Hand ein. Keine Bankanbindung — die wäre eine
       eigene Sicherheitsentscheidung und gehört nicht in die erste Fassung.</div>`}
    ${S.fin.konten.length?`<div class="hr"></div>
      <div class="row between"><span class="small muted">Summe</span>
        <b class="mono">${r1(sum(S.fin.konten.map(c=>c.betrag)))} €</b></div>`:''}
  </div>

  <div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Fälligkeiten${offen.length?` · ${offen.length} offen`:''}</h2>
      <button class="btn sm ghost" onclick="billAdd()">+</button></div>
    ${S.fin.bills.length?S.fin.bills.map(b=>{
      const spaet=!b.bezahlt&&b.faellig<todayISO();
      return `<div class="item">
      <button class="tick ${b.bezahlt?'on':''}" onclick="billPay('${b.id}')"
        aria-label="${esc(b.n)} — ${b.bezahlt?'bezahlt':'offen'}">${b.bezahlt?'&#10003;':''}</button>
      <div class="g"><input type="text" value="${esc(b.n)}" onchange="billSet('${b.id}','n',this.value)"
        style="background:transparent;border:none;padding:0;font-weight:600;font-size:var(--f-sec)">
        ${spaet?'<span class="tag hb">überfällig</span>':''}
        <input type="date" value="${b.faellig}" onchange="billSet('${b.id}','faellig',this.value)"
          style="background:transparent;border:none;padding:0;font-size:13px;color:var(--muted)"></div>
      <input type="number" step="0.01" value="${b.betrag}" onchange="billSet('${b.id}','betrag',this.value)"
        style="width:86px;text-align:right">
      <button class="x" onclick="billDel('${b.id}')">✕</button></div>`;}).join('')
     :`<div class="small muted">Rechnungen, Abos, Fristen.</div>`}
  </div>`;

  if(monat.length) h+=`<div class="card"><h2>Geprüfte Käufe (30 Tage)</h2>
    ${monat.slice(-10).reverse().map(x=>`<div class="item"><div class="g">
      <b style="font-weight:600">${esc(x.n)}</b><span>${esc(x.st)}</span></div>
      <div class="v">${r1(x.betrag)} €</div></div>`).join('')}
    <div class="hr"></div>
    <div class="row between"><span class="small muted">Summe geprüft</span>
      <b class="mono">${r1(sum(monat.map(x=>x.betrag)))} €</b></div>
  </div>`;

  h+=`<div class="card tight">${evTag('B')}
    <div class="small muted" style="margin-top:8px">Selbstbindung, Budgets und Zugriffshürden sind als
      Strategieklasse in einer Meta-Analyse über 29 Experimente gestützt. Dass ADHS mit schwierigeren
      Finanzentscheidungen einhergeht, ist in Beobachtungsstudien gezeigt — eine geprüfte
      ADHS-Finanz-App gibt es nicht. Deine 40 € und deine 21 Uhr sind Setzungen, keine Normwerte.</div></div>
  <div style="height:20px"></div>`;
  return h;
}

/* =========================================================================
   REFLEXION — Aufbau nach Liven: Stimmung, Gefühle, Körperempfindungen,
   Kontext, Freitext. Eine Frage pro Schritt, überall Mehrfachauswahl,
   und jede Liste um eigene Begriffe erweiterbar.

   Die alte Fassung (drei feste Fragen) hat Maik nichts gebracht — sie fragte
   nach einer Bewertung des Tages, statt beim Erfassen des Moments zu helfen.
   ========================================================================= */

/* Die fuenf Stimmungsfarben waren fuenf freie Buntwerte, vier davon unter 3:1
   gegen den Hintergrund — als Textfarbe unlesbar und als sechste bis zehnte
   Farbe der App ein Bruch von Regel 5.1. Die Kugel laeuft jetzt von der
   Warnfarbe ueber ein neutrales Grau zum Akzent: dieselben Toene wie ueberall
   sonst, und jeweils nur einer gleichzeitig sichtbar. Der Name steht als Wort
   daneben — die Farbe traegt keine Information allein. */
const MOODS=[
  {v:-2, n:'Furchtbar', c:'var(--warn)'},
  {v:-1, n:'Nicht gut', c:'var(--warn-line)'},
  {v: 0, n:'Neutral',   c:'var(--line-strong)'},
  {v: 1, n:'Gut',       c:'var(--acc-text)'},
  {v: 2, n:'Großartig', c:'var(--acc)'}
];
const moodOf=v=>MOODS.find(m=>m.v===v)||MOODS[2];

/* Gefühlslisten nach Valenz — sonst muss Maik bei „gut" durch fünfzehn
   negative Begriffe scrollen, und genau das bricht die Zehn-Sekunden-Regel. */
const FEEL={
  '-2':['Überfordert','Wütend','Ängstlich','Verzweifelt','Einsam','Beschämt','Schuldig',
        'Gereizt','Erschöpft','Hilflos','Traurig','Leer'],
  '-1':['Unruhig','Genervt','Unzufrieden','Angespannt','Unkonzentriert','Enttäuscht',
        'Unsicher','Müde','Gestresst','Unmotiviert','Nervös','Frustriert'],
  '0' :['Beschäftigt','Entspannt','Friedvoll','Gelangweilt','Gleichgültig','Müde',
        'Ruhig','Taub','Traurig','Unmotiviert','Verloren','Zufrieden'],
  '1' :['Zufrieden','Motiviert','Wach','Konzentriert','Gelassen','Dankbar','Verbunden',
        'Stolz','Erleichtert','Klar','Zuversichtlich','Ausgeglichen'],
  '2' :['Euphorisch','Stark','Voller Energie','Begeistert','Frei','Verliebt','Stolz',
        'Unbesiegbar','Dankbar','Ausgelassen','Selbstsicher','Im Flow']
};
const SENS=['Anspannung','Kopfschmerzen','Wärme','Schmerz','Erschöpfung','Offenheit',
  'Kribbeln','Müdigkeit','Enge in der Brust','Verkrampftheit','Unruhe in den Beinen',
  'Magendrücken','Kloß im Hals','Leichtigkeit','Schwere','Herzklopfen','Nichts Besonderes'];
const DOING=['Selbstgespräch','Studium','Aufgaben','Hobbys','Pendeln','Auf dem Balkon',
  'Trainieren','Handball','Im Bett liegen','Handy','Essen','Haushalt','Zocken','Serie',
  'Autofahren','Nichts'];
const WITHW=['Allein','Evi','Familie','Freunde','Mannschaft','Kollegen','Haustier','Fremde'];
const WHERE=['Zu Hause','Zimmer','Draußen','Gym','Halle','Uni','Unterwegs','Bei Evi','Auto'];

/* Eigene Begriffe. Maik hat in Liven genau das benutzt („Auf dem balkon sitzen",
   „starke anspannung/ druc") — ohne diese Möglichkeit passt die Liste nie. */
function jOpts(){ if(!S.jOpts) S.jOpts={feel:[],sens:[],doing:[],withw:[],where:[]};
  return S.jOpts; }
function optList(k,mood){
  const base = k==='feel' ? FEEL[String(mood)] : k==='sens' ? SENS
             : k==='doing'? DOING : k==='withw'? WITHW : WHERE;
  return [...base, ...(jOpts()[k]||[])];
}
window.jAddOpt=k=>{ const v=prompt('Eigener Eintrag:'); if(!v||!v.trim()) return;
  jOpts()[k].push(v.trim()); save(); jPick(k,v.trim()); };

/* ---- Ablauf: fünf Schritte, einer pro Bildschirm ---- */
let JD=null, JSTEP=0;
window.jStart=()=>{ JD={ts:Date.now(), mood:0, feel:[], sens:[], doing:[], withw:[], where:[], text:''};
  JSTEP=0; VIEW='journal'; render(); window.scrollTo(0,0); };
window.jCancel=()=>{ JD=null; JSTEP=0; render(); };
window.jMood=v=>{ JD.mood=v; render(); };
window.jPick=(k,v)=>{ const a=JD[k], i=a.indexOf(v);
  if(i<0) a.push(v); else a.splice(i,1); render(); };
window.jNext=()=>{ if(JSTEP===4){ jSave(); return; }
  if(JSTEP===4-1){ /* Freitext kommt als Letztes */ }
  JSTEP++; render(); window.scrollTo(0,0); };
window.jBack=()=>{ if(JSTEP===0){ jCancel(); return; } JSTEP--; render(); window.scrollTo(0,0); };
window.jText=v=>{ if(JD) JD.text=v; };
function jSave(){
  const t=document.getElementById('jTxt'); if(t) JD.text=t.value;
  const d=S.journal[DAY];
  /* Ältere Fassung speicherte ein Objekt mit drei Feldern. Nicht verlieren. */
  const list = Array.isArray(d) ? d : (d && (d.gut||d.schwer||d.morgen||d.frei))
    ? [{ts:0, mood:0, feel:[], sens:[], doing:[], withw:[], where:[],
        text:[d.gut,d.schwer,d.morgen,d.frei].filter(Boolean).join('\n')}]
    : [];
  list.push(JD); S.journal[DAY]=list; save();
  JD=null; JSTEP=0; render(); toast('Eingetragen');
}
function jEntries(d){ const x=S.journal[d];
  if(Array.isArray(x)) return x;
  if(x && (x.gut||x.schwer||x.morgen||x.frei)) return [{ts:0, mood:0, feel:[], sens:[],
    doing:[], withw:[], where:[], text:[x.gut,x.schwer,x.morgen,x.frei].filter(Boolean).join('\n')}];
  return [];
}

function chipBlock(k,mood,label){
  const list=optList(k,mood);
  return `${label?`<div class="jlab">${label}</div>`:''}
    <div class="chips" style="margin-bottom:14px">
      <button class="pill" onclick="jAddOpt('${k}')" style="font-weight:700">+</button>
      ${list.map(v=>`<button class="pill ${JD[k].includes(v)?'on':''}"
        onclick="jPick('${k}',$a(${A(v)}))">${esc(v)}</button>`).join('')}
    </div>`;
}

function jWizard(){
  const m=moodOf(JD.mood);
  const kopf=(t,s)=>`<div class="jhead"><h2 class="jq">${t}</h2>
    ${s?`<div class="small muted" style="margin-top:4px">${s}</div>`:''}</div>`;
  let h='';
  if(JSTEP===0){
    h+=kopf('Wie fühlst du dich gerade?');
    h+=`<div class="moodwrap">
      <div class="moodball" style="--mc:${m.c}"></div>
      <div class="moodname">${m.n}</div></div>
    <div class="row between xs muted" style="margin:0 2px 6px">
      <span>Furchtbar</span><span>Neutral</span><span>Großartig</span></div>
    <input type="range" min="-2" max="2" step="1" value="${JD.mood}" class="moodrange"
      oninput="jMood(+this.value)">`;
  }
  else if(JSTEP===1){
    h+=kopf(`Welche Gefühle haben dich <b>${m.n.toLowerCase()}</b> fühlen lassen?`,
            'Wähle alles, was zutrifft. Auch nichts ist eine Antwort.');
    h+=chipBlock('feel',JD.mood);
  }
  else if(JSTEP===2){
    h+=kopf('Welche Empfindungen gehen damit einher?','Im Körper, nicht im Kopf.');
    h+=chipBlock('sens',JD.mood);
  }
  else if(JSTEP===3){
    h+=kopf(`Ich fühle mich <b>${m.n.toLowerCase()}</b>`,
            'Erforsche, was dich beeinflusst.');
    h+=chipBlock('doing',JD.mood,'Was machst du gerade?');
    h+=chipBlock('withw',JD.mood,'Mit wem bist du?');
    h+=chipBlock('where',JD.mood,'Wo bist du?');
  }
  else {
    h+=kopf('Was hast du auf dem Herzen?','Freiwillig. Ein Satz reicht, keiner auch.');
    h+=`<textarea id="jTxt" rows="7" placeholder="Beginne zu schreiben …"
      style="font-size:17px;line-height:1.6">${esc(JD.text||'')}</textarea>`;
  }
  h+=`<div class="spacer"></div>
  <button class="btn acc" onclick="jNext()">${JSTEP===4?'Eintragen':'Weiter'}</button>
  <div class="spacer"></div>
  <button class="btn ghost sm" onclick="jBack()">${JSTEP===0?'Abbrechen':'Zurück'}</button>
  <div class="jdots">${[0,1,2,3,4].map(i=>`<i class="${i<=JSTEP?'on':''}"></i>`).join('')}</div>`;
  return h;
}

function entryCard(e,d){
  const m=moodOf(e.mood||0);
  const alle=[...(e.feel||[]),...(e.sens||[])];
  const kontext=[...(e.doing||[]),...(e.withw||[]),...(e.where||[])];
  const zeit=e.ts?new Date(e.ts).toTimeString().slice(0,5):'';
  return `<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <div class="row" style="gap:9px">
        <span class="mdot" style="background:${m.c}"></span>
        <b style="font-size:15px">${m.n}</b></div>
      <span class="xs muted mono">${d?human(d)+' · ':''}${zeit}</span></div>
    ${alle.length?`<div class="chips" style="margin-bottom:${kontext.length||e.text?'9px':'0'}">
      ${alle.map(x=>`<span class="pill xs">${esc(x)}</span>`).join('')}</div>`:''}
    ${kontext.length?`<div class="xs muted" style="margin-bottom:${e.text?'9px':'0'}">
      ${kontext.map(esc).join(' · ')}</div>`:''}
    ${e.text?`<div class="small" style="white-space:pre-wrap;line-height:1.6">${esc(e.text)}</div>`:''}
  </div>`;
}

/* Muster über 14 Tage — aber erst, wenn genug Einträge da sind.
   Vorher wäre jede „Erkenntnis" geraten. */
function jPattern(){
  const tage=Object.keys(S.journal).sort().slice(-14);
  const alle=tage.flatMap(d=>jEntries(d));
  if(alle.length<8) return {n:alle.length, genug:false};
  const zaehl=(k)=>{ const c={};
    alle.forEach(e=>(e[k]||[]).forEach(v=>c[v]=(c[v]||0)+1));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4); };
  const tief=alle.filter(e=>(e.mood||0)<0);
  const kontextTief={};
  tief.forEach(e=>[...(e.doing||[]),...(e.where||[])].forEach(v=>kontextTief[v]=(kontextTief[v]||0)+1));
  return {n:alle.length, genug:true,
    schnitt: alle.reduce((a,e)=>a+(e.mood||0),0)/alle.length,
    feel: zaehl('feel'), sens: zaehl('sens'),
    tief: Object.entries(kontextTief).sort((a,b)=>b[1]-a[1]).slice(0,3),
    tiefN: tief.length};
}

function vJournal(){
  if(JD) return jWizard();
  const heute=jEntries(DAY);
  const p=jPattern();
  const letzte=Object.keys(S.journal).sort().reverse().filter(d=>d!==DAY).slice(0,5);
  let h=`<div class="now" role="button" tabindex="0" onclick="jStart()">
    <div class="now-k">Reflexion</div>
    <div class="now-t">Wie fühlst du dich gerade?</div>
    <div class="now-s">Fünf kurze Schritte, jederzeit abbrechbar. Mehrmals am Tag ist normal.</div>
    <span class="btn acc" style="pointer-events:none" aria-hidden="true">Loslegen</span></div>`;

  if(heute.length){ h+=`<h2 class="sect">Heute · ${heute.length}</h2>`;
    h+=heute.slice().reverse().map(e=>entryCard(e)).join(''); }

  if(p.genug){
    const ms=moodOf(Math.round(p.schnitt));
    h+=`<div class="card">
      <h2>Muster der letzten 14 Tage</h2>
      <div class="row" style="gap:10px;margin-bottom:11px">
        <span class="mdot" style="background:${ms.c}"></span>
        <div><b>Im Schnitt ${ms.n.toLowerCase()}</b>
          <div class="xs muted">${p.n} Einträge, davon ${p.tiefN} im Minus</div></div></div>
      ${p.feel.length?`<div class="xs muted" style="margin-bottom:4px">Häufigste Gefühle</div>
        <div class="chips" style="margin-bottom:11px">
        ${p.feel.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}</span></span>`).join('')}</div>`:''}
      ${p.sens.length?`<div class="xs muted" style="margin-bottom:4px">Häufigste Körperempfindungen</div>
        <div class="chips" style="margin-bottom:11px">
        ${p.sens.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}</span></span>`).join('')}</div>`:''}
      ${p.tief.length?`<div class="xs muted" style="margin-bottom:4px">Wobei es dir schlechter ging</div>
        <div class="chips">${p.tief.map(([v,n])=>`<span class="pill xs">${esc(v)} <span class="dim">${n}×</span></span>`).join('')}</div>`:''}
      <div class="note">Das sind Häufigkeiten, keine Ursachen. Was oft zusammen auftritt, muss
        einander nicht auslösen — aber es ist der Ort, an dem du nachsehen kannst.</div>
    </div>`;
  } else if(p.n>0){
    h+=`<div class="card tight"><div class="small muted">Noch ${8-p.n} Einträge, dann zeigt die
      App Muster über die letzten vierzehn Tage. Vorher wäre jede Aussage geraten.</div></div>`;
  }

  if(letzte.length){ h+=`<h2 class="sect">Früher</h2>`;
    letzte.forEach(d=>{ jEntries(d).slice().reverse().forEach(e=>{ h+=entryCard(e,d); }); }); }
  h+='<div style="height:20px"></div>';
  return h;
}

function notDynamic(){
  const out=[];
  const t=tasksFor(DAY).find(x=>!x.done);
  if(t) out.push({t:'Deine Aufgabe: '+t.t, g:'nutzen',
    s:t.first?('Kleinster Start: '+t.first):'Nur anfangen, nicht fertig machen.'});
  const hx=(typeof hausNext==='function')?hausNext():null;
  if(hx) out.push({t:'Haushalt: '+hx.s.t, s:`${hx.quelle} · etwa ${hx.s.min} Minuten.`, g:'nutzen'});
  const w=windowsFor(DAY).find(x=>x.status==='now');
  if(w) out.push({t:w.n+' — jetzt wäre das Fenster', s:`Ziel ${w.kcal} kcal, ${w.prot} g Protein.`, g:'nutzen'});
  const inb=S.inbox.filter(x=>!/^app\s*:/i.test(x.t));
  if(inb.length) out.push({t:'Aus dem Eingang: '+inb[0].t, s:'Lag da und wartet.', g:'nutzen'});
  if(!sessionsOn(DAY).length) out.push({t:'Ins Gym', s:'Heute noch keine Einheit erfasst.', g:'bewegen'});
  return out;
}

function weekNums(){
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(DAY,-i));
  const ses=days.flatMap(d=>sessionsOn(d));
  const fenster=days.reduce((a,d)=>{ const m=S.adhs.meals[d]||{};
    return a+Object.values(m).filter(v=>v==='done').length; },0);
  const checks=days.filter(d=>hooper(d)!=null).length;
  const zig=days.reduce((a,d)=>a+(S.smoke[d]||[]).length,0);
  const dr=days.reduce((a,d)=>a+(S.drills[d]||[]).length,0);
  const last=sum(days.map(d=>loadOn(d)));
  return {days, ses:ses.length, fenster, checks, zig, dr, last};
}

window.claudeBericht=()=>{
  const w=weekNums(), M=meds();
  const L=[];
  L.push('Pivot-Bericht · '+human(todayISO()));
  L.push('');
  L.push(`Training: ${w.ses} Einheiten, Wochenlast ${w.last} sRPE`);
  const st=weekStats(DAY);
  if(st) L.push(`Monotonie ${r1(st.mono)}, Strain ${r0(st.strain)}`);
  L.push(`Tages-Checks: ${w.checks}/7${hooper(DAY)!=null?`, heute Hooper ${hooper(DAY)}`:''}`);
  L.push(`Essensfenster erfüllt: ${w.fenster}/28`);
  L.push(`Drills: ${w.dr} · Zigaretten: ${w.zig}`);
  const bw=S.beschw.filter(b=>b.offen);
  if(bw.length) L.push('Beschwerden offen: '+bw.map(b=>b.ort+(b.verlauf.length?` (${b.verlauf[b.verlauf.length-1].score}/100)`:'')).join(', '));
  const lowStock=M.filter(m=>medRange(m).warn);
  if(lowStock.length) L.push('Medikamentenbestand knapp: '+lowStock.map(m=>m.n).join(', '));
  const top=smokeTop(); if(top.length) L.push('Häufigster Auslöser: '+top[0][0]+' ('+top[0][1]+'×)');
  if(S.week.lief) L.push('Lief: '+S.week.lief);
  if(S.week.vergessen) L.push('Untergegangen: '+S.week.vergessen);
  /* Bekannte Lücke aus V5: Eingang und Parkplatz fehlten im Bericht, obwohl genau
     dort steht, was Maik über die App und über sich notiert hat. */
  const appNotes=S.inbox.filter(x=>/^app\s*:/i.test(x.t));
  const rest=S.inbox.filter(x=>!/^app\s*:/i.test(x.t));
  if(appNotes.length){ L.push('', 'Zur App ('+appNotes.length+'):');
    appNotes.forEach(x=>L.push('  - '+x.t.replace(/^app\s*:\s*/i,''))); }
  if(rest.length){ L.push('', 'Eingang ('+rest.length+'):');
    rest.forEach(x=>L.push('  - '+x.t)); }
  if(S.fokus.park.length){ L.push('', 'Ablenkungsparkplatz ('+S.fokus.park.length+'):');
    S.fokus.park.forEach(x=>L.push('  - '+x.t)); }
  const txt=L.join('\n');
  openSheet(`<h2>Bericht</h2>
    <textarea rows="14" readonly style="font-size:13px;line-height:1.6">${esc(txt)}</textarea>
    <div class="spacer"></div>
    <button class="btn acc" onclick="copyTxt(this)" data-t="${esc(txt)}">Kopieren</button>`);
};

  kurz:'Zur Sauna kann dieser Bericht nichts sagen — weder dafür noch dagegen.',

/* ---------- Tagesart ---------- */
function regSpieltag(){
  const r=S.reg||{}; if(r.spielDiese) return r.spielDiese;
  return r.spieltag==='sa'?'sa':r.spieltag==='so'?'so':null;
}
function regTagesart(d){
  const ses=sessionsOn(d);
  if(ses.some(s=>s.type==='handball'&&/spiel/i.test(s.label||''))) return 'spiel';
  if(ses.some(s=>s.type==='gym')) return 'kraft';
  if(ses.some(s=>s.type==='handball')) return 'team';
  const wd=parseISO(d).getDay(), sp=regSpieltag();
  if(sp==='so'&&wd===0) return 'spiel';
  if(sp==='sa'&&wd===6) return 'spiel';
  if(wd===1||wd===3) return 'team';

  /* Die Woche folgt dem Kraftplan, nicht mehr dem alten Rhythmus (Fr/Sa Kraft,
     Di Trainer, Do frei). Das war der Grund, warum an den beiden echten
     Krafttagen die falschen Hinweise standen — und zwar vor dem Training,
     wo sie gebraucht werden. Dienstag und Donnerstag sind Studio (Einheit A
     und B), Freitag ist Halle, Samstag frei oder Spiel.
     Die D-Jugend am Dienstag fällt nicht weg, sie bestimmt nur die
     Regeneration nicht: die schwere Beineinheit ist die größere Belastung. */
  if(wd===2||wd===4) return 'kraft';
  if(wd===5){
    /* An den Freitagen, an denen der Zyklus die Halle streicht (Woche 1 und 5),
       ist es ein freier Tag — sonst stünden Aufwärm- und Nachher-Hinweise
       für eine Einheit da, die nicht stattfindet. */
    const h=zykHeute(d);
    if(h && h.entfaellt) return 'frei';
    return 'halle';
  }
  if(wd===6) return sp==='sa'?'spiel':'frei';
  return 'frei';
}
const REG_ART={team:'Mannschaftstraining', kraft:'Krafttraining', spiel:'Spiel',
  halle:'Antritt in der Halle', trainer:'D-Jugend als Trainer',
  frei:'Trainingsfrei', nachspiel:'Tag nach dem Spiel'};

function regHat(k){ const h=(S.reg&&S.reg.hat)||{}; return h[k]!==false; }
function regDone(d,id){ return !!((S.reg.done||{})[d]||{})[id]; }
window.regTick=id=>{ const m=S.reg.done[DAY]=S.reg.done[DAY]||{};
  m[id]=!m[id]; save(); render(); };
window.regSet=(k,v)=>{ S.reg[k]=v; save(); render(); };
window.regHatSet=(k,v)=>{ S.reg.hat=S.reg.hat||{}; S.reg.hat[k]=v; save(); render(); };
function regNachSpiel(d){ return regTagesart(addDays(d,-1))==='spiel'; }

/* Der Tag nach dem Spiel ist eine eigene Art — sonst würde er als "frei"
   durchgehen und die Ruhetagsregel fehlte. */
function regArten(d){
  const out=[regTagesart(d)];
  if(regNachSpiel(d)) out.push('nachspiel');
  return out;
}
function regFor(art){
  const arten=Array.isArray(art)?art:[art];
  return REG.filter(x=>{
    if(x.braucht && !regHat(x.braucht)) return false;
    return x.wann.some(w=>arten.includes(w));
  });
}

/* Auf der Karte steht der erste Satz, im „?" der ganze. Segmenting-Prinzip:
   selbstgetaktete Abschnitte statt einer Textstrecke (d = 0,32–0,36, N = 7.713).
   Inhalt, Reihenfolge und Wortlaut der Einträge bleiben unverändert. */
function kurzSatz(t,max){ const s=String(t||'');
  /* Der Trenner darf nicht an jedem Punkt schneiden, sonst wird aus
     "ca. 10 Minuten" auf der Karte "ca." — die Zahl waere weg. */
  const erste=s.split(/(?<=[a-zäöüß0-9)][.!?])\s(?=[A-ZÄÖÜ])/)[0];
  /* Es werden nur ganze Sätze weggelassen, nie ein Satz in der Mitte
     abgeschnitten: ein halber Hinweis ("Kälte bremst den …") ist schlechter
     als eine Zeile mehr. Erst ab dem 1,6-fachen der Zielbreite wird doch
     gekürzt, damit ein künftiger Monstersatz die Karte nicht sprengt — dieser
     Pfad greift bei den heutigen Texten nirgends.

     WICHTIG für jeden neuen Eintrag: Sichtbar ist nur der ERSTE Satz. Alles,
     was eine Handlung einschränkt ("nur", "nicht", "kein", "erst",
     "frühestens", "bevor"), gehört deshalb in den ersten Satz. Ein Test in
     test.js erzwingt das. */
  if(erste.length<=Math.round(max*1.6)) return erste;
  const w=erste.split(' '); let out='';
  for(const x of w){ if((out+' '+x).trim().length>max) break; out=(out+' '+x).trim(); }
  return out+' …'; }

}
function regSmall(x){

/* ---------- Ansicht ---------- */
function vReg(){
  const arten=regArten(DAY);
  const liste=regFor(arten);
  const pflicht=liste.filter(x=>x.typ==='pflicht');
  const optional=liste.filter(x=>x.typ==='optional');
  const nein=REG_NEIN.filter(x=>x.wann.some(w=>arten.includes(w)));
  const fertig=pflicht.filter(x=>regDone(DAY,x.id)).length;
  const titel=arten.includes('nachspiel')?'Tag nach dem Spiel':REG_ART[arten[0]];

  h+=`<div class="rhead">

    <div class="bar" style="margin-top:10px"><i style="width:${pflicht.length?fertig/pflicht.length*100:0}%"></i></div>

    h+=nein.map(x=>`<div class="rcard no" role="button" tabindex="0"
      aria-label="${esc(x.n)} — warum" onclick="regWhy('${x.id}')"

      <span class="rw">${esc(kurzSatz(x.kurz,52))}</span></span>

  if(optional.length){

    h+=optional.map(regSmall).join('');

  /* Nullschritt-Drills: fachlich Prehab, gehören hierher und nicht in den Tagesplaner. */
  h+=drillCard();

  /* Alles Weitere eingeklappt — die Seite soll oben aufhören. */
  const auf=!!S.reg.mehr;
  h+=`<div class="card tight" style="margin-top:14px">
    <div class="row between">
      <span class="small muted">Wochenplan, Ausstattung, Termine</span>
      <button class="btn sm ghost" onclick="regSet('mehr',${!auf})">${auf?'Ausblenden':'Anzeigen'}</button></div>
  </div>`;

  if(auf){
    h+=`<div class="card">
      <h2>Deine Woche</h2>
      <div class="small muted" style="margin-bottom:11px">Spieltag umstellen — der Plan zieht mit.</div>
      <div class="chips" style="margin-bottom:12px">
        ${[['sa','Spiel Samstag'],['so','Spiel Sonntag'],[null,'Kein Spiel']].map(([k,l])=>
          `<button class="pill ${regSpieltag()===k?'on':''}"
            onclick="regSet('spielDiese',${k?`'${k}'`:'null'})">${l}</button>`).join('')}
      </div>
      ${[1,2,3,4,5,6,0].map(wd=>{
        const nm=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][wd];
        const heute=parseISO(DAY).getDay()===wd;
        const d=addDays(DAY, wd-parseISO(DAY).getDay());
        /* Kein Abdunkeln der uebrigen Tage: --muted bei 65 % Deckkraft kommt auf
           etwa 2,6:1 und faellt damit unter WCAG AA. Heute ist am Wort markiert. */
        return `<div class="item">
          <div class="g"><b style="font-size:var(--f-row)">${nm}</b>
            <span>${esc(REG_ART[regTagesart(d)])}</span></div>
          ${heute?'<span class="tag" style="background:var(--acc-dim);color:var(--acc)">heute</span>':''}</div>`;
      }).join('')}
      ${regSpieltag()==='sa'?`<div class="note">Bei Spiel am Samstag fällt das Krafttraining am
        Samstag weg oder wandert auf Donnerstag.</div>`:''}
    </div>

    <div class="card">
      <h2>Feste Termine in den Kalender</h2>
      <div class="small muted" style="margin-bottom:11px">Lädt eine Datei mit vier Wochen fester
        Blöcke. In jedem Termin steht genau das, was an dem Tag zu tun ist — nicht der ganze Plan.
        Die App selbst kann nicht erinnern, dein Kalender schon.</div>
      <button class="btn" onclick="regIcs()">Kalenderdatei laden</button>
    </div>

    <div class="card">
      <h2>Was du hast</h2>
      <div class="chips">
        ${[['wanne','Badewanne'],['sauna','Sauna'],['rolle','Rolle / Massagepistole'],
           ['kalt','Kaltwasser'],['venen','Venenengel']].map(([k,l])=>
          `<button class="pill ${regHat(k)?'on':''}" onclick="regHatSet('${k}',${!regHat(k)})">${l}</button>`).join('')}
      </div>
      <div class="note">Was du abwählst, verschwindet aus dem Plan.</div>
    </div>

    ${regHat('sauna')?`<div class="card">
      <h2>Sauna</h2>
      <div class="small" style="line-height:1.65;margin-bottom:10px">${esc(REG_SAUNA.kurz)}</div>
      <div class="warn">${esc(REG_SAUNA.arzt)}</div>
      <div class="spacer"></div>
      <div class="row between">
        <span class="small muted">Mit der Ärztin geklärt?</span>
        <button class="tick ${S.reg.saunaGeklaert?'on':''}"
          aria-label="Sauna mit der Ärztin geklärt — ${S.reg.saunaGeklaert?'ja':'noch nicht'}"
          onclick="regSet('saunaGeklaert',!S.reg.saunaGeklaert)">${S.reg.saunaGeklaert?'&#10003;':''}</button></div>
    </div>`:''}

    <div class="card tight">
      <div class="small muted" style="line-height:1.65">Der wichtigste Satz aus deinem Bericht:
        <b style="color:var(--text)">Das Wirksame sieht nicht nach Regeneration aus.</b>
        Schlaf, Essen, Trinken und vernünftige Belastung schlagen jedes Eisbad, jede Rolle und
        jede Sauna. Deshalb steht das oben unter Pflicht und der Rest darunter.
        Ausführlich in REGENERATION.md.</div></div>`;
  }
  h+='<div style="height:20px"></div>';
  return h;
}

/* ---------- Kalenderdatei ----------
   Jeder Termin enthält nur den Inhalt dieses Tages, als kurze Handlungsschritte
   ohne Fachbegriffe. Kein Verweis auf ein anderes Dokument. */
window.regIcs=()=>{
  const p2=n=>String(n).padStart(2,'0');
  const st=(d,hm)=>{const[H,M]=hm.split(':').map(Number);
    return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(H)+p2(M)+'00';};
  const esc2=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const blocks=[
    {wd:2, von:'18:00', bis:'18:15', n:'Waden und Sprunggelenk dehnen', cat:'Beweglichkeit',
     be:'Wade am Türrahmen dehnen, 3 mal 30 Sekunden pro Seite.\nKnie über die Zehen schieben, 10 mal pro Seite.\nHinsetzen und wirklich dehnen, nicht nebenbei.'},
    {wd:2, von:'18:20', bis:'18:35', n:'Balance und Landungen', cat:'Prävention',
     be:'Einbeinig stehen, 3 mal 30 Sekunden pro Bein.\nVon der Bank springen und weich landen, 10 mal.\nSeitliche Sprünge einbeinig, 10 pro Seite.'},
    {wd:4, von:'18:00', bis:'18:15', n:'Waden und Sprunggelenk dehnen', cat:'Beweglichkeit',
     be:'Gleiche Übungen wie Dienstag.\nWade am Türrahmen, 3 mal 30 Sekunden pro Seite.\nKnie über die Zehen, 10 mal pro Seite.'},
    {wd:4, von:'18:20', bis:'18:35', n:'Balance und Landungen', cat:'Prävention',
     be:'Einbeinig stehen, 3 mal 30 Sekunden pro Bein.\nVon der Bank springen und weich landen, 10 mal.\nSeitliche Sprünge einbeinig, 10 pro Seite.'},
    {wd:1, von:'22:15', bis:'22:30', n:'Warm baden', cat:'Schlaf',
     be:'Wanne so warm einlassen, wie es angenehm ist.\n10 Minuten drin bleiben.\nDanach Quark-Shake: 250 g Magerquark mit einem Löffel Proteinpulver.'},
    {wd:3, von:'22:15', bis:'22:30', n:'Warm baden', cat:'Schlaf',
     be:'Wanne so warm einlassen, wie es angenehm ist.\n10 Minuten drin bleiben.\nDanach Quark-Shake: 250 g Magerquark mit einem Löffel Proteinpulver.'}
  ];
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Pivot//Regeneration//DE\r\nCALSCALE:GREGORIAN\r\n';
  const heute=parseISO(todayISO());
  for(let w=0; w<4; w++) blocks.forEach(b=>{
    const d=new Date(heute);
    d.setDate(d.getDate() + ((b.wd - d.getDay() + 7) % 7) + w*7);
    ics+='BEGIN:VEVENT\r\n'
      +'UID:pivot-reg-'+b.wd+'-'+b.von.replace(':','')+'-'+w+'@pivot\r\n'
      +'DTSTAMP:'+st(new Date(),'12:00')+'\r\n'
      +'DTSTART:'+st(d,b.von)+'\r\n'+'DTEND:'+st(d,b.bis)+'\r\n'
      +'SUMMARY:'+esc2(b.n)+'\r\n'
      +'CATEGORIES:'+esc2(b.cat)+'\r\n'
      +'DESCRIPTION:'+esc2(b.be)+'\r\n'
      +'END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download='pivot-regeneration.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('Kalenderdatei geladen');
};

    <div class="hr"></div>
    <div class="small muted" style="line-height:1.7">
      Grundumsatz (Mifflin-St Jeor): <b class="mono" style="color:var(--text)">${r0(b)} kcal</b><br>
      Ziel ${human(DAY).toLowerCase()}: <b class="mono" style="color:var(--text)">${kt} kcal</b>
      · ${protTarget()} g Protein · ${carbTarget(DAY)} g KH · ${fatTarget(DAY)} g Fett
    </div>
    <div class="note">Geschätzt aus Formel und deinen Angaben — keine Messwerte.
      Woher die Zahlen kommen: ${Q('kcal')} ${Q('prot')}</div>
  </div>

  <div class="card">
    <h2>ADHS-Schicht</h2>
    <label class="f"><span>Einnahmezeit — der Anker für alle Essensfenster</span>
      <input type="time" value="${S.adhs.medTime}" onchange="setAdhs('medTime',this.value)"></label>
    <div class="chips" style="margin-bottom:12px">
      ${windowsFor(DAY).map(w=>`<span class="pill xs">${m2hm(w.from)}–${m2hm(w.to)}</span>`).join('')}
    </div>
    <label class="f"><span>Essensfenster anzeigen</span>
      <select onchange="setAdhs('useWindows',this.value==='1')">
        <option value="1" ${S.adhs.useWindows?'selected':''}>ja</option>
        <option value="0" ${S.adhs.useWindows?'':'selected'}>nein</option>
      </select></label>
    <div class="note">−20 min, +4 h, +7 h und +10 h ab Einnahme. ${Q('fenster')}</div>
  </div>

  <div class="card">
    <h2>Daten</h2>
    <div class="small muted" style="margin-bottom:12px">
      Alles liegt nur in diesem Browser. Löschst du den Browserspeicher, sind die Daten weg —
      also regelmäßig exportieren. ${Q('offline')}</div>
    <div class="btnrow">
      <button class="btn" onclick="expo()">⬇ Export</button>
      <button class="btn" onclick="document.getElementById('impFile').click()">⬆ Import</button>
    </div>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="impo(this)">
    <div class="item" role="button" tabindex="0" onclick="openSheet(bestandSheet())">
      <div class="g"><b>Was gespeichert ist</b>
        <span>${S.sessions.length} Einheiten · ${Object.keys(S.diary).length} Tage Ernährung
        · ${S.foods.length} Favoriten</span></div>
      <span class="ac muted" aria-hidden="true">&#8250;</span></div>
  </div>

  <div class="card">
    <h2>Darstellung und Grenzen</h2>
    <div class="chips" style="margin-bottom:12px">
      <button class="pill ${S.seen.theme==='dark'?'':'on'}" onclick="setTheme('light')">Hell</button>
      <button class="pill ${S.seen.theme==='dark'?'on':''}" onclick="setTheme('dark')">Dunkel</button>
    </div>
    <div class="item" role="button" tabindex="0" onclick="why('offline')">
      <div class="g"><b>Was ohne Netz und ohne Berechtigung geht</b>
        <span>Und was eine Web-App grundsätzlich nicht kann</span></div>
      <span class="ac muted" aria-hidden="true">&#8250;</span></div>
    <div class="item" role="button" tabindex="0" onclick="go('evidenz')">
      <div class="g"><b>Warum diese Zahlen</b><span>Quellen und Evidenzstufen je Kennzahl</span></div>
      <span class="ac muted" aria-hidden="true">&#8250;</span></div>
  </div>`;
}
function bestandSheet(){
  return `<h2>Was gespeichert ist</h2>
    <div class="item"><div class="g"><b>Trainingseinheiten</b></div>
      <span class="v mono">${S.sessions.length}</span></div>
    <div class="item"><div class="g"><b>Tage mit Ernährung</b></div>
      <span class="v mono">${Object.keys(S.diary).length}</span></div>
    <div class="item"><div class="g"><b>Tage mit Check</b></div>
      <span class="v mono">${Object.keys(S.well).length}</span></div>
    ${S.foods.length?`<div class="jlab" style="margin-top:20px">Favoriten (${S.foods.length})</div>
      ${S.foods.map((f,i)=>`<div class="item"><div class="g"><b>${esc(f.n)}</b>
        <span>${r0(f.kcal100)} kcal · ${r1(f.p)} P /100 g${f.bc?' · '+f.bc:''}</span></div>
        <button class="x" onclick="delFav(${i});openSheet(bestandSheet())">&#10005;</button></div>`).join('')}`:''}`;
}
window.setAdhs=(k,v)=>{ S.adhs[k]=v; save(); render(); };
window.setTheme=t=>{ S.seen.theme=t; save(); applyTheme(); render(); };
function applyTheme(){
  /* V6: Hell ist Standard (Maik: "hellere darstellung"), Dunkel bleibt wählbar. */
  const hell = S.seen.theme!=='dark';
  if(hell){ document.body.dataset.theme='light'; }
  else document.body.dataset.theme='dark';
  document.documentElement.style.background = hell ? '#f1ece2' : '#171411';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', hell?'#f1ece2':'#171411');
}
window.setP=(k,v)=>{ S.profile[k]=(k==='sex'||k==='goal')?v:parseFloat(v); save();
  if(VIEW==='me') render(); };
window.delFav=i=>{ S.foods.splice(i,1); save(); render(); };
window.expo=()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='pivot-backup-'+todayISO()+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  S.seen.lastExport=Date.now(); save(); render(); toast('Export erstellt');
};
window.impo=inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d || typeof d!=='object' || Array.isArray(d)) throw 0;
      if(!d.profile || typeof d.profile!=='object') throw 0;
      /* Nur bekannte Bereiche übernehmen. Alles Unbekannte aus einer fremden
         oder manipulierten Datei bleibt draußen. */
      const rein={};
      Object.keys(DEF).forEach(k=>{ if(k in d) rein[k]=d[k]; });
      S=deepMerge(structuredClone(DEF),rein); save(); render();
      toast('Import erfolgreich'); }
    catch(e){ toast('Datei nicht lesbar'); } };
  r.readAsText(f); inp.value='';
};

/* =========================================================================
   START
   ========================================================================= */
applyTheme();
/* Routinen beim Start anlegen statt beim ersten Aufruf — sonst hängt es vom
   zufällig zuerst gerenderten Bildschirm ab, wann der Zustand vollständig ist. */
routines();
if(S.seen.ver && S.seen.ver!==APP_VERSION) S.seen.updated=1;
if(S.seen.ver!==APP_VERSION){ S.seen.ver=APP_VERSION; save(); }
render();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopScan(); flush(); } });
</script>
</body>
</html>
