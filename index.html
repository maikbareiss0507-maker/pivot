<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pivot — Training, Last & Ernährung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#121620; --surface:#1b212c; --surface2:#242b39; --line:#333c4d;
  --text:#eef2f8; --muted:#9aa5b6; --dim:#6b7789;
  --acc:#4ade80; --acc-dim:#1e3d2b;
  --blue:#63a9f5; --amber:#f5b13d; --red:#f87171; --violet:#ab8cf7;
  --area:#4ade80;
  --r:15px; --pad:16px;
  color-scheme:dark;
}
body[data-ph="morning"]  {--ph1:#3a2f14; --ph2:#1c2130; --phc:#f5b13d}
body[data-ph="midday"]   {--ph1:#153226; --ph2:#1a2130; --phc:#4ade80}
body[data-ph="dip"]      {--ph1:#3a2a15; --ph2:#1c2130; --phc:#f5b13d}
body[data-ph="evening"]  {--ph1:#1b2c40; --ph2:#1a2030; --phc:#63a9f5}
body[data-ph="winddown"] {--ph1:#26203f; --ph2:#1a1f2e; --phc:#ab8cf7}
body[data-ph="night"]    {--ph1:#1a1e2b; --ph2:#171b26; --phc:#9aa5b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--blue)}

/* ---------- Layout ---------- */
header.top{position:sticky;top:0;z-index:40;background:rgba(18,22,32,.93);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:19px}
header.top .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
main{padding:var(--pad);max-width:640px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(24,29,40,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--dim);font-size:10.5px;font-weight:550;letter-spacing:.01em}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--area)}
nav.tabs button.on svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--area) 55%,transparent))}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
.card h2::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--area);margin-right:7px;vertical-align:middle;transform:translateY(-1px)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin-bottom:10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:12.5px}.xs{font-size:11.5px}
.big{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1.1}
.mono{font-variant-numeric:tabular-nums}
.spacer{height:6px}
.hr{height:1px;background:var(--line);margin:12px -14px}

.btn{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;width:100%}
.btn:active{transform:scale(.985)}
.btn.acc{background:var(--acc);color:#06210f;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 11px;font-size:13px;width:auto;border-radius:9px}
.btn.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:550}
.inline{display:flex;gap:8px}.inline>*{flex:1}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:550}
.pill.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}

.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .g{flex:1;min-width:0}
.item .g b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.item .g span{font-size:12px;color:var(--muted)}
.item .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.x{color:var(--dim);padding:6px;font-size:17px;line-height:1}

.empty{text-align:center;color:var(--dim);padding:26px 10px;font-size:13.5px}

/* ---------- Sheet / modal ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:88vh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  padding:8px var(--pad) calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .handle{width:38px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:17px;margin-bottom:12px;text-transform:none;letter-spacing:-.01em;color:var(--text)}

/* ---------- Readiness ---------- */
.ready{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0}
.ring .lbl b{font-size:26px;font-weight:680;letter-spacing:-.02em}
.ring .lbl span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.scale{display:flex;gap:5px;margin-top:6px}
.scale button{flex:1;padding:11px 0;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--acc);color:#06210f;border-color:transparent}
.scale.warm button.on{background:var(--amber);color:#2b1d00}

/* ---------- Scanner ---------- */
#scanwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;
  aspect-ratio:4/3;display:none}
#scanwrap.on{display:block}
#scanvid{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:18% 10%;border:2px solid rgba(74,222,128,.9);
  border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanmsg{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;font-size:12.5px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}

/* ---------- Chart ---------- */
.chart{width:100%;height:112px;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--dim);font-size:9px}

.tag{font-size:10.5px;font-weight:650;padding:2.5px 7px;border-radius:6px;
  background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.hb{background:#3a2a12;color:#fbbf24}
.tag.gym{background:#12303c;color:#60a5fa}
.tag.other{background:#2a2440;color:#a78bfa}

.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.warn{background:#33210f;border:1px solid #63430f;color:#fcd34d;border-radius:10px;
  padding:9px 11px;font-size:12.5px;margin-top:9px}

/* ---------- Die eine nächste Handlung ---------- */
.now{background:linear-gradient(155deg,var(--ph1,#16301f),var(--ph2,#141a17));
  border:1px solid color-mix(in srgb,var(--phc,#4ade80) 55%,transparent);
  border-radius:var(--r);padding:18px 16px;margin-bottom:12px;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
.now:active{transform:scale(.99)}
.now-k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--phc,var(--acc));
  font-weight:700;margin-bottom:6px}
.now-t{font-size:22px;font-weight:680;letter-spacing:-.02em;line-height:1.2}
.now-s{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.now-go{font-size:12.5px;color:var(--phc,var(--acc));font-weight:620;margin-top:11px}
.phase-h{font-size:12.5px;color:var(--muted);margin:-2px 0 12px;line-height:1.45}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--area);color:#0b1220}
.rest{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.rest::-webkit-scrollbar{display:none}
.rest a{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:7px}
.rest a i{width:7px;height:7px;border-radius:50%;background:var(--area);font-style:normal}

/* ---------- Essensfenster ---------- */
.win{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:11px;background:var(--surface2);
  border:1px solid var(--line);margin-bottom:7px}
.win:active{transform:scale(.99)}
.win-i{font-size:19px;flex:0 0 auto}
.win-g{flex:1;min-width:0}
.win-g b{display:block;font-size:14.5px;font-weight:620}
.win-g span{font-size:11.5px;color:var(--muted)}
.win-s{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;
  color:var(--dim);white-space:nowrap}
.win.now{background:var(--acc-dim);border-color:var(--acc);border-radius:11px;padding:11px 12px;
  margin-bottom:7px;background-image:none}
.win.now .win-s{color:var(--acc)}
.win.done{opacity:.5}
.win.done .win-s{color:var(--acc)}
.win.skip{opacity:.45}
.win.missed{border-color:#5a3b12}
.win.missed .win-s{color:var(--amber)}

/* ---------- Mahlzeiten unter dem Fenster ---------- */
.mealrow{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 9px 30px}
.meal{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;text-align:left}
.meal b{font-size:12.5px;font-weight:620}
.meal span{font-size:10.5px;color:var(--muted)}
.meal:active{background:var(--acc);color:#06210f}
.meal.add{color:var(--muted);font-size:12.5px;font-weight:600;justify-content:center;
  border-style:dashed}

/* ---------- Tagesleiste ---------- */
.track{position:relative;height:26px;border-radius:8px;background:var(--surface2);
  overflow:hidden;border:1px solid var(--line)}
.track .dip{position:absolute;top:0;bottom:0;background:rgba(251,191,36,.14);
  border-left:1px solid rgba(251,191,36,.35);border-right:1px solid rgba(251,191,36,.35)}
.track .wblk{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--dim)}
.track .wblk.now{background:var(--acc)}
.track .wblk.done{background:var(--acc);opacity:.5}
.track .wblk.missed{background:var(--amber);opacity:.6}
.track .wblk.skip{background:var(--dim);opacity:.35}
.track .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--blue)}
.track .nowline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);
  box-shadow:0 0 0 2px rgba(0,0,0,.45)}

/* ---------- Warum-Knopf ---------- */
.qm{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface2);color:var(--muted);font-size:10.5px;font-weight:750;
  line-height:1;display:inline-flex;align-items:center;justify-content:center;
  vertical-align:middle;margin-left:3px;flex:0 0 auto;padding:0}
.qm:active{background:var(--acc);color:#06210f}

/* ---------- Ritual-Uhr ---------- */
.clock{font-size:56px;font-weight:700;letter-spacing:-.03em;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--acc);padding:14px 0}

/* ---------- Abhaken ---------- */
.tick{width:28px;height:28px;flex:0 0 auto;border-radius:9px;border:1.8px solid var(--line);
  background:var(--surface2);color:#06210f;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--acc);border-color:var(--acc)}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(84px + env(safe-area-inset-bottom));background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-size:13.5px;
  font-weight:550;z-index:120;opacity:0;pointer-events:none;transition:all .22s;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="hTitle">Heute</h1>
    <div class="sub" id="hSub"></div>
  </div>
  <button class="btn sm ghost" id="dateBtn">📅</button>
</header>

<main id="app"></main>

<nav class="tabs" id="nav"></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================================
   Pivot — lokaler Trainings-, Last- und Ernährungstracker
   Alle Daten bleiben im Browser (localStorage). Kein Server, kein Account.
   Wissenschaftliche Grundlagen sind in ./QUELLEN.md dokumentiert.
   ========================================================================= */

const KEY='pivot.v1';
const APP_VERSION='4.0';
const DEF={
  profile:{sex:'m',age:25,height:183,weight:84,pal:1.5,protPerKg:1.8,carbPerKg:5,
           goal:'maintain',kcalOverride:null},
  foods:[],        // Favoriten
  diary:{},        // 'YYYY-MM-DD' -> [{n,g,kcal,p,c,f,bc,ts}]
  sessions:[],     // {id,date,type,label,min,rpe,ex:[{n,sets:[{w,r,rir}]}],note}
  well:{},         // 'YYYY-MM-DD' -> {sleepQ,fat,str,sore,sleepH,hrv,bw}
  adhs:{
    medTime:'08:15',   // Einnahmezeit — einziger Anker, alle Fenster leiten sich davon ab
    useWindows:true,
    std:{},            // Fenster -> [{n,kcal100,p,c,f,g}] Standardmahlzeit
    meals:{},          // 'YYYY-MM-DD' -> {w1:'done'|'skip', ...}
    rules:[],          // Wenn-dann-Regeln
    tasks:{},          // 'YYYY-MM-DD' -> [{t,first,slot,done}]
    ruleDone:{},       // 'YYYY-MM-DD' -> {ruleId:true}
    wake:'08:00', bed:'00:00',
    routines:null,     // wird beim ersten Start gesetzt
    rDone:{},          // 'YYYY-MM-DD' -> {stepId:true}
    emergency:{},      // 'YYYY-MM-DD' -> true, wenn Notfallversion gewählt
    focus:{}           // 'YYYY-MM-DD' -> {used:true}
  },
  seen:{}
};

let S = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)||'null');
       return r? deepMerge(structuredClone(DEF),r) : structuredClone(DEF); }
  catch(e){ return structuredClone(DEF); }
}
function deepMerge(a,b){ for(const k in b){
  if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]) deepMerge(a[k],b[k]);
  else a[k]=b[k]; } return a; }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(flush,120); }
/* Sofort schreiben, wenn die App in den Hintergrund geht oder geschlossen wird —
   sonst geht eine Eingabe verloren, die kurz vor dem Schließen gemacht wurde. */
function flush(){ clearTimeout(saveT);
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('Speicher voll — bitte exportieren'); } }
window.addEventListener('pagehide',flush);
window.addEventListener('beforeunload',flush);

/* ---------- Datum & Helfer ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const todayISO=()=>iso(new Date());
let DAY = todayISO();
const DOW=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function human(s){ const d=parseISO(s); const t=todayISO();
  if(s===t) return 'Heute'; if(s===addDays(t,-1)) return 'Gestern';
  return DOW[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]; }
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:0;
function sd(a){ if(a.length<2)return 0; const m=mean(a);
  return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1)); }

window.setInput=(id,v)=>{document.getElementById(id).value=v;};
function toast(msg){ const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2100); }

/* =========================================================================
   WISSENSCHAFTLICHE RECHENLOGIK
   ========================================================================= */

/* Grundumsatz — Mifflin-St Jeor (1990), genauer als Harris-Benedict */
function bmr(){ const p=S.profile;
  const base=10*p.weight + 6.25*p.height - 5*p.age;
  return p.sex==='f' ? base-161 : base+5; }

/* Trainingsenergie: MET × kg × h  (Compendium of Physical Activities) */
const MET={handball:7.0, gym:5.0, other:6.5};
function sessionKcal(s){ return (MET[s.type]||6)*S.profile.weight*(s.min/60); }

/* Tagesziel Energie: Grundumsatz × PAL + Trainingsanteil des Tages */
function kcalTarget(day){
  const p=S.profile;
  if(p.kcalOverride) return p.kcalOverride;
  let t = bmr()*p.pal;
  t += sum(sessionsOn(day).map(sessionKcal))*0.5; // Hälfte, weil der PAL-Faktor Training teils enthält
  if(p.goal==='gain') t+=300; if(p.goal==='lose') t-=350;
  return r0(t/10)*10;
}
/* Protein: ISSN Position Stand 1,4–2,0 g/kg | KH: ACSM 5–7 g/kg im Mannschaftssport */
const protTarget=()=>r0(S.profile.weight*S.profile.protPerKg);
function carbTarget(day){
  const hard=sum(sessionsOn(day||DAY).map(s=>s.min))>=45;
  const gk = hard ? S.profile.carbPerKg : Math.max(3, S.profile.carbPerKg-2);
  return r0(S.profile.weight*gk); }
function fatTarget(day){
  const rest=kcalTarget(day)-protTarget()*4-carbTarget(day)*4;
  return Math.max(35, r0(rest/9)); }

/* session-RPE (Foster 1998): Last = RPE(0–10) × Dauer in Minuten */
const srpe=s=>(s.rpe||0)*(s.min||0);
const sessionsOn=d=>S.sessions.filter(s=>s.date===d);
function loadOn(d){ return sum(sessionsOn(d).map(srpe)); }
function loadRange(endDay,n){ const out=[];
  for(let i=n-1;i>=0;i--){ const d=addDays(endDay,-i); out.push({d,v:loadOn(d)}); }
  return out; }
/* Monotonie & Strain (Foster 1998): Wochenlast / SD der Tageslasten */
function weekStats(endDay){
  const days=loadRange(endDay,7).map(x=>x.v);
  const total=sum(days), s=sd(days);
  const enough = days.filter(v=>v>0).length>=3;
  const mono = (enough && s>0) ? mean(days)/s : 0;
  return {total, mono, strain: total*mono, days};
}
/* 7:28-Verhältnis — NUR als Darstellung, nicht als Verletzungsprognose.
   Siehe Impellizzeri et al. 2020 zur Kritik an der ACWR. */
function ratio728(endDay){
  const hist=S.sessions.filter(s=>s.date<=endDay).map(s=>s.date).sort();
  if(!hist.length || hist[0] > addDays(endDay,-20)) return 0;   // erst ab ~3 Wochen sinnvoll
  const acute=sum(loadRange(endDay,7).map(x=>x.v));
  const chron=sum(loadRange(endDay,28).map(x=>x.v))/4;
  return chron>0 ? acute/chron : 0;
}

/* Hooper-Index (Hooper & Mackinnon 1995): 4 Items je 1–7, Summe 4–28, niedrig = gut */
const HOOP=[
  {k:'sleepQ', s:'Schlaf',      l:'Schlafqualität', lo:'sehr gut', hi:'sehr schlecht'},
  {k:'fat',    s:'Müdigkeit',  l:'Müdigkeit',      lo:'sehr frisch', hi:'sehr müde'},
  {k:'str',    s:'Stress',     l:'Stress',         lo:'sehr wenig', hi:'sehr viel'},
  {k:'sore',   s:'Muskelkater',l:'Muskelkater',    lo:'keiner', hi:'stark'}
];
function hooper(d){ const w=S.well[d]; if(!w) return null;
  const v=HOOP.map(h=>w[h.k]); if(v.some(x=>!x)) return null; return sum(v); }
/* Baseline: individuelle 14-Tage-Referenz (Saw et al. 2016: Abweichung vom
   eigenen Normalwert ist aussagekräftiger als ein absoluter Score) */
function hooperBase(endDay){
  const vals=[]; for(let i=1;i<=14;i++){ const h=hooper(addDays(endDay,-i)); if(h!=null)vals.push(h); }
  return vals.length>=4 ? {m:mean(vals),s:sd(vals),n:vals.length} : null;
}
function readiness(d){
  const h=hooper(d); if(h==null) return null;
  const b=hooperBase(d);
  let score;
  if(b && b.s>0.4){ const z=(h-b.m)/b.s; score=clamp(50-z*18,0,100); }   // relativ
  else { score=clamp((28-h)/24*100,0,100); }                             // absolut
  return {score:r0(score), hooper:h, base:b};
}

/* e1RM — Epley, RIR als zusätzliche Wiederholungen (Zourdos et al. 2016) */
function e1rm(w,reps,rir){ const r=(reps||0)+(rir||0);
  if(!w||!r) return 0; if(r===1) return w; return w*(1+r/30); }
function bestE1RM(name){ let best=0,when=null;
  for(const s of S.sessions) for(const e of (s.ex||[]))
    if(e.n.toLowerCase()===name.toLowerCase())
      for(const st of e.sets){ const v=e1rm(st.w,st.r,st.rir); if(v>best){best=v;when=s.date;} }
  return {v:best,when}; }
function volumeWeek(endDay){ const from=addDays(endDay,-6); const map={};
  for(const s of S.sessions){ if(s.date<from||s.date>endDay) continue;
    for(const e of (s.ex||[])){ const v=sum(e.sets.map(x=>(x.w||0)*(x.r||0)));
      map[e.n]=(map[e.n]||0)+v; } }
  return Object.entries(map).sort((a,b)=>b[1]-a[1]); }

/* Ernährung des Tages */
function dayMacros(d){ const e=S.diary[d]||[];
  return {kcal:sum(e.map(x=>x.kcal)), p:sum(e.map(x=>x.p)),
          c:sum(e.map(x=>x.c)), f:sum(e.map(x=>x.f)), n:e.length}; }

/* =========================================================================
   ADHS-SCHICHT
   Grundgedanke: Nicht der Hunger steuert das Essen, sondern die Uhr.
   Stimulanzien dämpfen den Appetit über die Wirkdauer; wer auf das
   Hungersignal wartet, isst tagsüber zu wenig und abends zu viel.
   Alle Fenster leiten sich aus einer einzigen Zeit ab: der Einnahme.
   ========================================================================= */
const hm2m=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+m;};
const m2hm=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+':'+pad(((m%60)+60)%60);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};

/* Offsets in Minuten ab Einnahme. Anlehnung an den Wirkverlauf von
   Lisdexamfetamin: Wirkeintritt nach etwa 1–1,5 h, Spitze nach 3,5–4,5 h,
   Nachlassen nach etwa 10–12 h. */
const WIN=[
  {k:'w1', n:'Vor dem Wirkeintritt', off:[-20,45], p:.30, c:.25, ico:'☀️',
   why:'Jetzt ist der Appetit noch da. Was hier nicht reingeht, fehlt dir den ganzen Tag.'},
  {k:'w2', n:'Mittag', off:[240,330], p:.30, c:.30, ico:'🍽',
   why:'Wirkspitze — der Hunger meldet sich nicht. Trotzdem essen, gegen das Gefühl.'},
  {k:'w3', n:'Nachmittag', off:[420,480], p:.15, c:.15, ico:'🥤',
   why:'Kleine Portion gegen das Tief. Darf etwas sein, das keine Vorbereitung braucht.'},
  {k:'w4', n:'Abend', off:[600,720], p:.25, c:.30, ico:'🌙',
   why:'Wirkung lässt nach, der Hunger kommt zurück. Vorbereitetes Essen schlägt den Lieferdienst.'}
];
function windowsFor(day){
  const base=hm2m(S.adhs.medTime||'08:15');
  const past = day<todayISO();
  const now = nowMin();
  return WIN.map(w=>{
    const from=base+w.off[0], to=base+w.off[1];
    const set=(S.adhs.meals[day]||{})[w.k];
    let status = set || 'open';
    if(!set){ if(past || now>to) status='missed'; else if(now>=from) status='now'; }
    return {...w, from, to, status,
      kcal:r0(kcalTarget(day)*w.c), prot:r0(protTarget()*w.p)};
  });
}
function markWindow(day,k,st){
  const m=S.adhs.meals[day]=S.adhs.meals[day]||{}; m[k]=st; save();
}
/* Mahlzeiten eines Fensters. Altes Einzel-Format wird automatisch migriert. */
function stdMeals(k){
  let v=S.adhs.std[k];
  if(!v||!v.length) return [];
  if(v[0] && v[0].items===undefined){        // altes Format: flache Zutatenliste
    v=[{name:'Standard', items:v}]; S.adhs.std[k]=v; save();
  }
  return v;
}
const mealSum=m=>({
  kcal:sum(m.items.map(f=>f.kcal100*f.g/100)),
  p:sum(m.items.map(f=>f.p*f.g/100))
});
/* Eine Mahlzeit in einem Tap eintragen */
window.eatMeal=(k,i)=>{
  const m=stdMeals(k)[i]; if(!m) return;
  let kc=0;
  for(const f of m.items){ const q=f.g/100;
    (S.diary[DAY]=S.diary[DAY]||[]).push({n:f.n,g:f.g,kcal:f.kcal100*q,p:f.p*q,c:f.c*q,f:f.f*q,ts:Date.now()});
    kc+=f.kcal100*q; }
  markWindow(DAY,k,'done'); save(); closeSheet(); render();
  toast(esc(m.name)+' · '+r0(kc)+' kcal eingetragen');
};
window.skipWindow=(k)=>{ markWindow(DAY,k,'skip'); closeSheet(); render();
  toast('Übersprungen — kein Problem'); };
window.doneWindow=(k)=>{ markWindow(DAY,k,'done'); closeSheet(); render();
  toast('Abgehakt'); };

const RULE_SEED=[

  {wenn:'das Training endet', dann:'trinke ich sofort meinen Shake', trigger:'train'},

  {wenn:'ich um 15 Uhr durchhänge', dann:'gehe ich fünf Minuten vor die Tür ins Licht', trigger:'dip'}
];
function activeRules(day){
  const now=nowMin(), base=hm2m(S.adhs.medTime||'08:15');
  const trained=sessionsOn(day).length>0;
  const missed=windowsFor(day).some(w=>w.status==='missed');
  return S.adhs.rules.filter(r=>{
    if(r.trigger==='wake') return now<base+120;
    if(r.trigger==='med')  return now>=base && now<base+180;
    if(r.trigger==='train')return trained;
    if(r.trigger==='missed')return missed;
    if(r.trigger==='dip')  return now>=900 && now<=1020;
    if(r.trigger==='eve')  return now>=1140;
    return true;
  });
}

/* ---------- Reparatur statt Streak ----------
   Kein Streak-Zähler. Gemessen wird, wie viele der letzten 14 Tage erfasst
   sind und wie schnell nach einer Lücke wieder erfasst wurde. Ein Aussetzer
   darf nichts zurücksetzen. */
function coverage(day,n=14){
  let hit=0; for(let i=0;i<n;i++){ const d=addDays(day,-i);
    if(hooper(d)!=null || (S.diary[d]||[]).length || sessionsOn(d).length) hit++; }
  return {hit,n,pct:r0(hit/n*100)};
}
function gapInfo(day){
  let gap=0; for(let i=1;i<=14;i++){ const d=addDays(day,-i);
    if(hooper(d)!=null || (S.diary[d]||[]).length || sessionsOn(d).length) break; gap++; }
  return gap;
}
/* Offene Punkte von gestern, die sich nachtragen lassen */
function repairables(day){
  const y=addDays(day,-1), out=[];
  if(hooper(y)==null) out.push({k:'check', l:'Tages-Check von gestern', act:`setDay('${y}');openSheet(wellSheet())`});
  if(!sessionsOn(y).length) out.push({k:'ses', l:'Einheit von gestern nachtragen', act:`setDay('${y}');VIEW='train';render()`});
  if(!(S.diary[y]||[]).length) out.push({k:'eat', l:'Essen von gestern nachtragen', act:`setDay('${y}');VIEW='food';render()`});
  return out;
}

/* ---------- Fokusfenster nach dem Training ----------
   Mehren et al. 2019: 30 min moderates Radfahren verbesserte bei Erwachsenen mit
   ADHS die Reaktionszeiten im Flanker-Test, bei Kontrollpersonen nicht.
   Einzelstudie, n=23 — die Dauer eines solchen Fensters ist damit NICHT belegt.
   Die App schlägt es deshalb vor und lässt Maik selbst prüfen, ob es bei ihm trägt. */
function focusWindow(day){
  if(day!==todayISO()) return null;
  const ses=sessionsOn(day); if(!ses.length) return null;
  if((S.adhs.focus[day]||{}).used) return null;
  const open=tasksFor(day).filter(t=>!t.done);
  return {n:ses.length, task:open[0]||null};
}
window.useFocus=()=>{ (S.adhs.focus[DAY]=S.adhs.focus[DAY]||{}).used=true; save();
  closeSheet(); render(); };

/* ---------- Die eine nächste Handlung ---------- */
function nextAction(day){
  if(day!==todayISO()) return null;
  if(hooper(day)==null)
    return {t:'Tages-Check', s:'Vier Fragen, zwanzig Sekunden.', a:'openSheet(wellSheet())', ico:'✓'};
  const w=windowsFor(day).find(x=>x.status==='now');
  if(w) return {t:w.n, s:`Bis ${m2hm(w.to)} · Ziel ${w.kcal} kcal, ${w.prot} g Protein`,
                a:`openSheet(winSheet('${w.k}'))`, ico:w.ico};
  const t=tasksFor(day).find(x=>!x.done);
  if(t) return {t:t.t, s:t.first?('Kleinster Start: '+t.first):'Erste Hauptaufgabe',
                a:`openSheet(taskSheet())`, ico:'→'};
  const ses=sessionsOn(day);
  if(!ses.length) return {t:'Einheit erfassen', s:'Falls du heute trainiert hast.',
                a:"VIEW='train';render()", ico:'🏋️'};
  return {t:'Für heute erledigt', s:'Alles erfasst.', a:'', ico:'✓'};
}

  tag:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 14h3M7.5 17.5h6"/>',
  food:'<path d="M4 3v8a3 3 0 006 0V3"/><path d="M7 11v10"/><path d="M17 3c-1.5 2-2 4-2 7 0 2 1 3 2 3s2-1 2-3c0-3-.5-5-2-7z"/><path d="M17 13v8"/>',
  train:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>'
};
const TABS=[['now','Jetzt'],['tag','Tag'],['food','Essen'],['train','Training'],['me','Profil']];
const AREA={now:'var(--phc,#4ade80)', tag:'#4ade80', food:'#f5b13d', train:'#63a9f5', me:'#ab8cf7'};
const TITLE={now:'Jetzt', tag:'Dein Tag', food:'Essen', train:'Training', me:'Profil'};
let VIEW='now', trainSeg='ses';

function phase(){
  const n=nowMin(), w=hm2m(S.adhs.wake||'08:00'), m=hm2m(S.adhs.medTime||'08:15');
  if(n < w-45) return 'night';
  if(n < m+150) return 'morning';
  if(n < 900)   return 'midday';
  if(n <= 1020) return 'dip';
  if(n < 1260)  return 'evening';
  return 'winddown';
}
const PHASE={
  morning:{t:'Morgen', s:'Deine beste Phase beginnt. Routine, essen, dann das Wichtigste.'},
  midday: {t:'Vormittag', s:'Konzentrationsfenster. Hier gehört die Hauptaufgabe hin.'},
  dip:    {t:'Nachmittagstief', s:'Deine schwächste Phase. Jetzt nichts Großes — essen, Licht, Bewegung.'},
  evening:{t:'Abend', s:'Training erfassen, essen, langsam runterkommen.'},
  winddown:{t:'Wind-down', s:'Abendroutine und drei Aufgaben für morgen. Mehr nicht.'},
  night:  {t:'Nacht', s:'Eigentlich Schlafzeit.'}
};

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>
    `<button data-t="${k}" class="${VIEW===k?'on':''}">
      <svg viewBox="0 0 24 24">${ICON[k]}</svg><span>${l}</span></button>`).join('');
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-t]'); if(!b) return;
  stopScan(); VIEW=b.dataset.t; render(); window.scrollTo(0,0);
});
document.getElementById('dateBtn').addEventListener('click',()=>openSheet(dateSheet()));
window.go=(v,seg)=>{ VIEW=v; if(seg) trainSeg=seg; closeSheet(); render(); window.scrollTo(0,0); };
window.setSeg=v=>{ trainSeg=v; render(); };

/* Sheet */
const sheetEl=document.getElementById('sheet'), bgEl=document.getElementById('sheetBg');
function openSheet(html){ document.getElementById('sheetBody').innerHTML=html;
  sheetEl.classList.add('on'); bgEl.classList.add('on'); }
function closeSheet(){ sheetEl.classList.remove('on'); bgEl.classList.remove('on'); stopScan(); }
bgEl.addEventListener('click',closeSheet);
window.closeSheet=closeSheet;

function dateSheet(){
  return `<h2>Tag wählen</h2>
  <label class="f"><span>Datum</span>
    <input type="date" id="dPick" value="${DAY}" max="${todayISO()}"></label>
  <div class="btnrow">
    <button class="btn" onclick="setDay('${addDays(DAY,-1)}')">← Vortag</button>
    <button class="btn" onclick="setDay('${todayISO()}')">Heute</button>
  </div>
  <div class="spacer"></div>
  <button class="btn acc" onclick="setDay(document.getElementById('dPick').value)">Übernehmen</button>`;
}
window.setDay=d=>{ if(d){DAY=d; closeSheet(); render();} };

function render(){
  document.body.dataset.ph=phase();
  document.documentElement.style.setProperty('--area', AREA[VIEW]);
  renderNav();
  document.getElementById('hTitle').textContent=TITLE[VIEW];
  const dd=parseISO(DAY);
  document.getElementById('hSub').textContent=
    (DAY===todayISO()?'':human(DAY)+' · ')+DOW[dd.getDay()]+', '+dd.getDate()+'. '+MON[dd.getMonth()];
  document.getElementById('app').innerHTML=
    ({now:vNow, tag:vTag, food:vFood, train:vTrain, me:vMe})[VIEW]();
  if(VIEW==='train' && trainSeg==='load') drawCharts();
}

/* Ring-SVG */
function ring(pct,color,label,sub){
  const R=42,C=2*Math.PI*R,off=C*(1-clamp(pct,0,100)/100);
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="${R}" stroke="var(--surface2)" stroke-width="9" fill="none"/>
    <circle cx="48" cy="48" r="${R}" stroke="${color}" stroke-width="9" fill="none"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
  </svg><div class="lbl"><b>${label}</b><span>${sub}</span></div></div>`;
}
function barRow(label,val,target,unit,color){
  const p=target?clamp(val/target*100,0,100):0;
  return `<div style="margin-bottom:9px">
    <div class="row between xs" style="margin-bottom:4px">
      <span class="muted" style="font-weight:600">${label}</span>
      <span class="mono">${r0(val)} / ${r0(target)} ${unit}</span></div>
    <div class="bar"><i style="width:${p}%;background:${color}"></i></div></div>`;
}

/* =========================================================================
   VIEW: JETZT — nur was zu dieser Uhrzeit zählt
   ========================================================================= */
function miniRoutine(kind){
  const st=routineSteps(kind,DAY), pr=routineProgress(kind,DAY);
  const next=st.find(x=>!stepDone(DAY,x.id));
  const title=kind==='morning'?(isEmergency(DAY)?'Morgen · Notfallversion':'Morgenroutine'):'Abendroutine';
  if(!next) return `<div class="card tight"><div class="row between">
    <span class="small"><b>${title}</b> — durch</span>
    <span class="small" style="color:var(--acc);font-weight:650">${pr.done}/${pr.all} &#10003;</span></div></div>`;
  return `<div class="card">
    <div class="row between" style="margin-bottom:9px">
      <h2 style="margin:0">${title}</h2><span class="xs muted mono">${pr.done}/${pr.all}</span></div>
    <div class="item" style="padding:5px 0">
      <button class="tick" onclick="tickStep('${next.id}')"></button>
      <div class="g"><b style="font-weight:550;white-space:normal;font-size:14.5px">${esc(next.t)}</b>
        <span>nächster Schritt</span></div>
      ${next.why?Q(next.why):''}</div>
    <div class="hr"></div>
    <button class="btn ghost sm" onclick="go('tag')">Ganze Routine öffnen</button>
  </div>`;
}
function winCard(k){
  const w=windowsFor(DAY).find(x=>x.k===k); if(!w) return '';
  if(w.status==='done'||w.status==='skip') return '';
  const meals=stdMeals(k);
  return `<div class="card">
    <div class="row between" style="margin-bottom:4px">
      <h2 style="margin:0">${w.ico} ${w.n}</h2>
      <span class="xs muted mono">${m2hm(w.from)}–${m2hm(w.to)}</span></div>
    <div class="xs muted" style="margin-bottom:10px">Ziel ${w.kcal} kcal · ${w.prot} g Protein</div>
    ${meals.length?`<div class="mealrow" style="margin-left:0">
      ${meals.map((m,i)=>{const su=mealSum(m);
        return `<button class="meal" onclick="eatMeal('${k}',${i})">
          <b>${esc(m.name)}</b><span>${r0(su.kcal)} kcal · ${r0(su.p)} P</span></button>`;}).join('')}
      </div>`:''}
    <div class="btnrow">
      <button class="btn sm ${meals.length?'':'acc'}" onclick="openSheet(winSheet('${k}'))">
        ${meals.length?'Etwas anderes':'Mahlzeit anlegen'}</button>
      <button class="btn sm ghost" onclick="skipWindow('${k}')">Auslassen</button>
    </div></div>`;
}

function vNow(){
  const ph=phase(), P=PHASE[ph];
  const na=nextAction(DAY), wins=windowsFor(DAY);
  const cov=coverage(DAY), gap=gapInfo(DAY), ses=sessionsOn(DAY);
  const tasks=tasksFor(DAY), open=tasks.filter(t=>!t.done);
  let h='';

  if(S.seen.updated){
    h+=`<div class="card tight" style="border-color:var(--acc)">
      <div class="small"><b>Version ${APP_VERSION} installiert.</b> Deine Einträge sind alle da.</div>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="S.seen.updated=0;save();render()">Verstanden</button></div>`;
  }
  if(!S.seen.setup){
    h+=`<div class="card" style="border-color:var(--acc)">
      <h2 style="color:var(--acc)">Zuerst einrichten</h2>
      <div class="small muted" style="margin-bottom:12px">Gewicht, Größe, Alter, Alltagsaktivität
        und Einnahmezeit. Eine Minute, danach nie wieder.</div>
      <button class="btn acc" onclick="S.seen.setup=1;save();go('me')">Profil ausfüllen</button>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="S.seen.setup=1;save();render()">Später</button></div>`;
  }

  if(na){
    h+=`<div class="now" ${na.a?`onclick="${na.a}"`:''}>
      <div class="now-k">${P.t} · ${m2hm(nowMin())}</div>
      <div class="now-t">${na.ico} ${esc(na.t)}</div>
      <div class="now-s">${esc(na.s)}</div>
      ${na.a?'<div class="now-go">Antippen →</div>':''}</div>`;
  }
  h+=`<div class="phase-h">${P.s}</div>`;

  if(gap>=2 && cov.hit>=2 && (hooper(DAY)!=null||(S.diary[DAY]||[]).length||ses.length)){
    h+=`<div class="card tight" style="border-color:var(--acc)">
      <div class="small"><b>Willkommen zurück.</b> ${gap} Tage Lücke — die zählt nicht gegen dich.</div></div>`;
  }

  const fw=focusWindow(DAY);
  if(fw){
    h+=`<div class="card" style="border-color:var(--violet)">
      <div class="row between" style="margin-bottom:6px">
        <b style="font-size:15px">Fokusfenster offen ${Q('fokus')}</b></div>
      <div class="small muted" style="margin-bottom:11px">Du hast trainiert. Direkt nach Belastung
        ist die Chance auf eine gute Konzentrationsphase erhöht${fw.task?` — ${esc(fw.task.t)} wäre dran`:''}.</div>
      <div class="btnrow">
        <button class="btn sm acc" onclick="${fw.task?`startRitual('${esc(fw.task.first||fw.task.t).replace(/'/g,'')}')`:`openSheet(taskSheet())`}">Zwei Minuten starten</button>
        <button class="btn sm ghost" onclick="useFocus()">Später</button></div></div>`;
  }

  const cur = wins.find(x=>x.status==='now');
  if(ph==='morning'){
    h+=miniRoutine('morning');
    h+=winCard(cur?cur.k:'w1');
  }
  else if(ph==='midday'){
    if(cur) h+=winCard(cur.k);
    if(open.length){
      const t=open[0];
      h+=`<div class="card">
        <h2>Jetzt ist deine Phase</h2>
        <div class="small muted" style="margin-bottom:11px">Nach der Einnahme und vor dem Tief —
          hier gehört die wichtigste Aufgabe hin.</div>
        <div class="item" style="padding:4px 0"><button class="tick" onclick="tickTask(${tasks.indexOf(t)})"></button>
          <div class="g"><b>${esc(t.t)}</b><span>${t.first?'Start: '+esc(t.first):''}</span></div></div>
        <div class="spacer"></div>
        <button class="btn acc" onclick="startRitual('${esc(t.first||t.t).replace(/'/g,'')}')">Zwei Minuten starten</button>
      </div>`;
    } else {
      h+=`<div class="card"><h2>Keine Aufgabe gesetzt</h2>
        <div class="small muted" style="margin-bottom:11px">Deine beste Phase läuft gerade ungenutzt.</div>
        <button class="btn acc" onclick="openSheet(taskSheet())">Eine Aufgabe setzen</button></div>`;
    }
  }
  else if(ph==='dip'){
    h+=`<div class="card tight" style="border-color:var(--amber)">
      <div class="small"><b>Jetzt nichts Großes anfangen.</b> Zwischen 15 und 17 Uhr ist deine
      Initiierung am schwächsten. Essen, raus ins Licht, kurz bewegen — das reicht.</div></div>`;
    h+=winCard(cur?cur.k:'w3');
    const dipRules=S.adhs.rules.filter(r=>r.trigger==='dip');
    if(dipRules.length) h+=`<div class="card"><h2>Deine Regel für jetzt</h2>
      ${dipRules.map(r=>`<div class="item"><button class="tick ${ruleDone(DAY,r.id)?'on':''}"
        onclick="tickRule('${r.id}')">${ruleDone(DAY,r.id)?'&#10003;':''}</button>
        <div class="g"><b style="font-weight:500;white-space:normal">Wenn ${esc(r.wenn)},
        dann ${esc(r.dann)}.</b></div></div>`).join('')}</div>`;
  }
  else if(ph==='evening'){
    if(!ses.length) h+=`<div class="card"><h2>Heute trainiert?</h2>
      <div class="small muted" style="margin-bottom:11px">Erfassen dauert zwanzig Sekunden.
        RPE etwa eine halbe Stunde nach Ende bewerten.</div>
      <button class="btn acc" onclick="go('train')">Einheit erfassen</button></div>`;
    h+=winCard(cur?cur.k:'w4');
    h+=miniRoutine('evening');
  }
  else if(ph==='winddown'||ph==='night'){
    h+=miniRoutine('evening');
    const tomo=tasksFor(addDays(DAY,1));
    h+=`<div class="card"><h2>Morgen</h2>
      ${tomo.length? tomo.map(t=>`<div class="item"><div class="g"><b>${esc(t.t)}</b>
        <span>${t.first?esc(t.first):''}</span></div></div>`).join('')
        :`<div class="small muted" style="margin-bottom:11px">Noch nichts festgelegt. Drei Stück,
          jede mit einem ersten Schritt — dann startet morgen früh von selbst.</div>`}
      <button class="btn ${tomo.length?'ghost sm':'acc'}" onclick="setDay('${addDays(DAY,1)}');openSheet(taskSheet())">
        ${tomo.length?'Ändern':'Drei Aufgaben setzen'}</button></div>`;
  }

  if(hooper(DAY)==null && ph!=='night')
    h+=`<div class="card tight"><div class="row between">
      <span class="small muted">Tages-Check fehlt noch</span>
      <button class="btn sm" onclick="openSheet(wellSheet())">20 Sekunden</button></div></div>`;

  const offen=wins.filter(w=>w.status==='open'||w.status==='now').length;
  h+=`<div class="rest">
    <a onclick="go('tag')"><i></i>Tagesplan</a>
    <a onclick="go('food')"><i style="background:var(--amber)"></i>${offen} Fenster offen</a>
    <a onclick="go('train')"><i style="background:var(--blue)"></i>${ses.length} Einheiten</a>
    <a onclick="go('train','load')"><i style="background:var(--violet)"></i>Wochenlast</a>
  </div>`;
  return h;
}

/* =========================================================================
   VIEW: TAG — Planer, Routinen, Aufgaben, Regeln
   ========================================================================= */
function vTag(){
  const rd=readiness(DAY), tasks=tasksFor(DAY), rules=S.adhs.rules;
  const rep=repairables(DAY), cov=coverage(DAY);
  let h=dayBar(DAY);

  if(rd){
    const col = rd.score>=60?'var(--acc)':rd.score>=40?'var(--amber)':'var(--red)';
    const txt = rd.score>=60?'Über deinem Normalwert':rd.score>=40?'Im normalen Bereich':'Unter deinem Normalwert';
    h+=`<div class="card"><div class="ready">
      ${ring(rd.score,col,rd.score,'Bereit')}
      <div style="flex:1">
        <div style="font-weight:640;font-size:15px;margin-bottom:3px">${txt} ${Q('bereit')}</div>
        <div class="small muted">Hooper ${rd.hooper}/28${rd.base?` · Schnitt ${r1(rd.base.m)}`:''}</div>
        <div class="chips" style="margin-top:9px">
          ${HOOP.map(x=>`<span class="pill xs">${x.s} ${S.well[DAY][x.k]}</span>`).join('')}</div>
      </div></div>
      <div class="hr"></div>
      <button class="btn ghost sm" onclick="openSheet(wellSheet())">Check anpassen</button></div>`;
  } else {
    h+=`<div class="card"><h2>Tages-Check</h2>
      <div class="small muted" style="margin-bottom:12px">Vier Fragen, zwanzig Sekunden.
        Subjektives Befinden reagiert sensibler auf Belastung als jeder Sensor.</div>
      <button class="btn acc" onclick="openSheet(wellSheet())">Check starten</button></div>`;
  }

  h+=routineCard('morning');
  h+=routineCard('evening');

  h+=`<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h2 style="margin:0">Heute wichtig${tasks.length?` · ${tasks.filter(t=>t.done).length}/${tasks.length}`:''}</h2>
      ${tasks.length<3?`<button class="btn sm" onclick="openSheet(taskSheet())">+</button>`:''}</div>
    ${tasks.length? tasks.map((t,i)=>`
      <div class="item">
        <button class="tick ${t.done?'on':''}" onclick="tickTask(${i})">${t.done?'&#10003;':''}</button>
        <div class="g" style="${t.done?'opacity:.45;text-decoration:line-through':''}">
          <b>${esc(t.t)}</b>
          <span>${t.first?'Start: '+esc(t.first):''}${t.slot?' · '+SLOTS[t.slot]:''}</span></div>
        ${t.done?'':`<button class="btn sm acc" style="padding:6px 9px;font-size:11.5px"
          onclick="startRitual('${esc(t.first||t.t).replace(/'/g,'')}')">2 Min</button>`}
        <button class="x" onclick="delTask(${i})">✕</button></div>
      ${t.slot==='nach'&&!t.done?`<div class="warn">Nachmittag ist deine schwächste Phase.
        Wenn das wirklich passieren soll, zieh es auf den Vormittag.</div>`:''}`).join('')
      : `<div class="empty">Höchstens drei. Mehr hält kein Tag aus.</div>
         <button class="btn acc" onclick="openSheet(taskSheet())">Erste Aufgabe setzen</button>`}
  </div>`;

  h+=`<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h2 style="margin:0">Wenn-dann ${Q('wenndann')}</h2>
      <button class="btn sm" onclick="openSheet(ruleSheet())">${rules.length?'Regeln':'+'}</button></div>
    ${rules.length? rules.map(r=>`
      <div class="item">
        <button class="tick ${ruleDone(DAY,r.id)?'on':''}" onclick="tickRule('${r.id}')">${ruleDone(DAY,r.id)?'&#10003;':''}</button>
        <div class="g" style="${ruleDone(DAY,r.id)?'opacity:.45':''}">
          <b style="font-weight:500;white-space:normal">Wenn ${esc(r.wenn)}, dann ${esc(r.dann)}.</b>
          <span>${TRIG[r.trigger]||''}</span></div></div>`).join('')
      : `<div class="empty">Noch keine Regeln.</div>
         <button class="btn acc" onclick="openSheet(ruleSheet())">Regeln anlegen</button>`}
  </div>`;

  if(rep.length && cov.hit>=2){
    h+=`<div class="card"><h2>Nachtragen</h2>
      <div class="small muted" style="margin-bottom:10px">Von gestern offen. Kostet nichts.</div>
      ${rep.map(r=>`<button class="btn ghost sm" style="width:100%;justify-content:flex-start;margin-bottom:6px"
        onclick="${r.act}">${r.l}</button>`).join('')}</div>`;
  }

  const dSince = S.seen.lastExport ? (Date.now()-S.seen.lastExport)/864e5 : null;
  h+=`<div class="card tight">
    <div class="row between xs">
      <span class="muted">Erfasst · 14 Tage ${Q('streak')}</span>
      <span class="mono">${cov.hit}/${cov.n} Tage</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${cov.pct}%"></i></div>
    ${cov.hit>=3 && (dSince===null||dSince>7)?`<div class="warn">
      ${dSince===null?'Du hast noch nie exportiert.':'Letzter Export vor '+r0(dSince)+' Tagen.'}
      Deine Daten liegen nur in diesem Browser.
      <div class="spacer"></div>
      <button class="btn sm" onclick="expo()">Jetzt exportieren</button></div>`:''}
  </div>`;
  return h;
}

/* ---------- Tagesleiste ---------- */
function dayBar(day){
  const w=hm2m(S.adhs.wake||'08:00');
  let b=hm2m(S.adhs.bed||'00:00'); if(b<=w) b+=1440;
  const pos=m=>clamp((m-w)/(b-w)*100,0,100);
  const wins=windowsFor(day);
  const now=nowMin(), showNow=(day===todayISO() && now>=w-60);
  const dipA=pos(900), dipB=pos(1020);
  return `<div class="card tight">
    <div class="row between xs muted" style="margin-bottom:7px">
      <span>Tag · ${S.adhs.wake} bis ${S.adhs.bed}</span>
      <span>${showNow?'jetzt '+m2hm(now):''}</span></div>
    <div class="track">
      <div class="dip" style="left:${dipA}%;width:${Math.max(dipB-dipA,0)}%"></div>
      ${wins.map(x=>`<div class="wblk ${x.status}" title="${x.n}"
        style="left:${pos(x.from)}%;width:${Math.max(pos(x.to)-pos(x.from),1.5)}%"></div>`).join('')}
      <div class="mark med" style="left:${pos(hm2m(S.adhs.medTime))}%"></div>
      ${showNow?`<div class="nowline" style="left:${pos(now>=w?now:now+1440)}%"></div>`:''}
    </div>
    <div class="row between xs dim" style="margin-top:6px">
      <span>Einnahme ${S.adhs.medTime}</span>
      <span style="color:var(--amber)">Tief 15–17</span>
      <span>Bett ${S.adhs.bed}</span></div>
  </div>`;
}

/* ---------- Routinen-Karte ---------- */
function routineCard(kind){
  const day=DAY, st=routineSteps(kind,day), pr=routineProgress(kind,day);
  const emer=kind==='morning'&&isEmergency(day);
  const title=kind==='morning'?(emer?'Morgen · Notfallversion':'Morgenroutine'):'Abendroutine';
  const done=pr.done===pr.all;
  return `<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h2 style="margin:0">${title}</h2>
      <span class="xs ${done?'':'muted'}" style="${done?'color:var(--acc);font-weight:650':''}">${pr.done}/${pr.all}</span></div>
    ${st.map(x=>`<div class="item" style="padding:7px 0">
      <button class="tick ${stepDone(day,x.id)?'on':''}" onclick="tickStep('${x.id}')">${stepDone(day,x.id)?'✓':''}</button>
      <div class="g" style="${stepDone(day,x.id)?'opacity:.42;text-decoration:line-through':''}">
        <b style="font-weight:500;white-space:normal;font-size:14px">${esc(x.t)}</b></div>
      ${x.why?Q(x.why):''}</div>`).join('')}
    ${kind==='morning'?`<div class="hr"></div>
      <button class="btn ghost sm" onclick="setEmergency(${emer?'false':'true'})">
        ${emer?'Zurück zur vollen Version':'Heute nur die Notfallversion'}</button>
      ${emer?'':'<div class="note">Schlechter Tag? Die Notfallversion ist vier Schritte und zählt genauso.</div>'}`:''}
  </div>`;
}

/* ---------- Startritual ---------- */

/* ---------- Sheet: Mahlzeit zusammenstellen ---------- */
function mealSheet(k,mi){
  const w=WIN.find(x=>x.k===k), meals=stdMeals(k);
  const m = mi!=null ? meals[mi] : null;
  const items = m ? m.items : (S._draft||[]);
  if(mi==null) S._draft = items;
  const su = items.length? {kcal:sum(items.map(f=>f.kcal100*f.g/100)), p:sum(items.map(f=>f.p*f.g/100))} : {kcal:0,p:0};
  return `<h2>${m?'Mahlzeit ändern':'Neue Mahlzeit'} · ${w.n}</h2>
  <div class="small muted" style="margin-bottom:12px">Ziel in diesem Fenster:
    ${r0(kcalTarget(DAY)*w.c)} kcal, ${r0(protTarget()*w.p)} g Protein.</div>
  <label class="f"><span>Name</span>
    <input type="text" id="mealName" value="${esc(m?m.name:'')}"
      placeholder="${k==='w1'?'Haferflocken mit Quark':k==='w4'?'Reis mit Hähnchen':'Shake'}"></label>
  ${items.length? items.map((f,i)=>`<div class="item"><div class="g"><b>${esc(f.n)}</b>
      <span>${f.g} g · ${r0(f.kcal100*f.g/100)} kcal</span></div>
      <button class="x" onclick="mealDel('${k}',${mi},${i})">✕</button></div>`).join('')
    :'<div class="empty">Noch keine Zutat</div>'}
  ${items.length?`<div class="row between small" style="padding:8px 0">
    <span class="muted">Summe</span><b class="mono">${r0(su.kcal)} kcal · ${r0(su.p)} g P</b></div>`:''}
  <div class="hr"></div>
  ${S.foods.length?`
    <label class="f"><span>Zutat aus deinen Favoriten</span>
      <select id="stdF">${S.foods.map((f,i)=>`<option value="${i}">${esc(f.n)}</option>`).join('')}</select></label>
    <label class="f"><span>Menge in Gramm</span>
      <input type="number" id="stdG" value="150" inputmode="decimal"></label>
    <button class="btn" onclick="mealAdd('${k}',${mi})">+ Zutat</button>`
  :`<div class="warn">Du hast noch keine Favoriten. Scanne erst ein paar Produkte, dann kannst du
     sie hier zu Mahlzeiten zusammenstellen.</div>
    <button class="btn" onclick="closeSheet();VIEW='food';render()">Zu Essen</button>`}
  <div class="spacer"></div>
  <div class="btnrow">
    <button class="btn acc" onclick="mealSave('${k}',${mi})">Speichern</button>
    ${m?`<button class="btn sm danger" onclick="mealRemove('${k}',${mi})">Löschen</button>`:''}
  </div>`;
}
window.mealAdd=(k,mi)=>{
  const i=parseInt(document.getElementById('stdF').value);
  const g=parseFloat(document.getElementById('stdG').value)||0;
  if(!g){toast('Menge fehlt');return;}
  const f=S.foods[i], it={n:f.n,kcal100:f.kcal100,p:f.p,c:f.c,f:f.f,g};
  const name=document.getElementById('mealName').value;
  if(mi!=null){ stdMeals(k)[mi].items.push(it); save(); }
  else { S._draft=(S._draft||[]); S._draft.push(it); }
  openSheet(mealSheet(k,mi));
  const el=document.getElementById('mealName'); if(el) el.value=name;
};
window.mealDel=(k,mi,i)=>{
  if(mi!=null) stdMeals(k)[mi].items.splice(i,1); else S._draft.splice(i,1);
  save(); openSheet(mealSheet(k,mi));
};
window.mealSave=(k,mi)=>{
  const name=document.getElementById('mealName').value.trim()||'Mahlzeit';
  if(mi!=null){ stdMeals(k)[mi].name=name; }
  else {
    const items=S._draft||[];
    if(!items.length){ toast('Noch keine Zutat'); return; }
    S.adhs.std[k]=stdMeals(k); S.adhs.std[k].push({name,items}); S._draft=null;
  }
  save(); openSheet(winSheet(k)); render(); toast('Gespeichert');
};
window.mealRemove=(k,mi)=>{ stdMeals(k).splice(mi,1); save(); openSheet(winSheet(k)); render(); };

/* ---------- Scanner ---------- */
let stream=null, scanning=false, detector=null, lastCode=null;
window.toggleScan=async()=>{
  if(scanning){ stopScan(); return; }
  const wrap=document.getElementById('scanwrap'), note=document.getElementById('scanNote');
  if(!('BarcodeDetector' in window)){
    note.innerHTML='<div class="warn">Dieser Browser kennt die BarcodeDetector-API nicht. '+
      'Auf Android-Chrome funktioniert sie. Nutze solange die manuelle Eingabe (✎) — '+
      'dort kannst du die EAN auch eintippen.</div>'; return; }
  try{
    detector = detector || new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    stream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    const v=document.getElementById('scanvid');
    v.srcObject=stream; await v.play();
    wrap.classList.add('on'); scanning=true; lastCode=null;
    document.getElementById('scanBtn').textContent='■ Scan stoppen';
    note.innerHTML=''; loopScan(v);
  }catch(e){
    note.innerHTML='<div class="warn">Kamera nicht verfügbar: '+esc(e.name)+
      '. Die Seite muss über HTTPS laufen und der Kamerazugriff erlaubt sein.</div>'; }
};
function stopScan(){
  scanning=false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const w=document.getElementById('scanwrap'); if(w) w.classList.remove('on');
  const b=document.getElementById('scanBtn'); if(b) b.textContent='📷 Barcode scannen';
}
async function loopScan(v){
  if(!scanning) return;
  try{
    const codes=await detector.detect(v);
    if(codes.length){
      const c=codes[0].rawValue;
      if(c && c!==lastCode){
        lastCode=c;
        if(navigator.vibrate) navigator.vibrate(35);
        document.getElementById('scanmsg').textContent='Gefunden: '+c;
        stopScan(); lookup(c); return;
      }
    }
  }catch(e){/* Einzelframe-Fehler ignorieren */}
  requestAnimationFrame(()=>loopScan(v));
}

/* ---------- Open Food Facts ---------- */
const OFF_FIELDS='product_name,product_name_de,brands,nutriments,quantity,serving_quantity,serving_size,nutriscore_grade';
async function lookup(bc){
  const fav=S.foods.find(f=>f.bc===bc);
  if(fav){ openSheet(portionSheet(fav,true)); return; }
  openSheet(`<h2>Suche…</h2><div class="empty">EAN ${bc} wird bei Open Food Facts abgefragt.</div>`);
  try{
    const url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(bc)}.json?fields=${OFF_FIELDS}`;
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await res.json();
    if(j.status!==1 || !j.product){ openSheet(manualSheet(bc,true)); return; }
    const p=j.product, n=p.nutriments||{};
    const num=k=>{const v=n[k]; return typeof v==='number'?v:0;};
    let kcal=num('energy-kcal_100g');
    if(!kcal && num('energy_100g')) kcal=num('energy_100g')/4.184;
    const food={
      n:(p.product_name_de||p.product_name||'Unbenannt')+(p.brands?' · '+p.brands.split(',')[0].trim():''),
      kcal100:r1(kcal), p:r1(num('proteins_100g')), c:r1(num('carbohydrates_100g')),
      f:r1(num('fat_100g')), bc, serv:p.serving_quantity?parseFloat(p.serving_quantity):null,
      grade:p.nutriscore_grade||null
    };
    openSheet(portionSheet(food,false));
  }catch(e){
    openSheet(`<h2>Keine Verbindung</h2>
      <div class="small muted" style="margin-bottom:12px">Open Food Facts ist gerade nicht erreichbar.
      Du kannst die Werte von der Verpackung eintippen — sie werden als Favorit gespeichert
      und beim nächsten Scan dieser EAN sofort erkannt.</div>
      ${manualSheet(bc,true)}`);
  }
}

/* Plausibilitätsprüfung: Atwater 4/4/9 gegen deklarierte kcal */
function plausible(f){
  const calc=f.p*4+f.c*4+f.f*9;
  if(!f.kcal100||!calc) return null;
  const dev=Math.abs(calc-f.kcal100)/f.kcal100;
  return dev>0.15 ? r0(calc) : null;
}

    ${f.grade?` · Nutri-Score ${f.grade.toUpperCase()}`:''}</div>
  ${warn?`<div class="warn">Rechnerisch ergeben die Makros ${warn} kcal statt ${r0(f.kcal100)} —
    Abweichung über 15 %. Open-Food-Facts-Daten sind community-gepflegt; Werte kurz gegen die

  <div class="spacer"></div>

function vLoad(){
  const ws=weekStats(DAY), prev=weekStats(addDays(DAY,-7));
  const rt=ratio728(DAY);
  const diff=prev.total? (ws.total-prev.total)/prev.total*100 : 0;
  const byType={handball:0,gym:0,other:0};
  for(let i=0;i<7;i++) for(const s of sessionsOn(addDays(DAY,-i))) byType[s.type]+=srpe(s);
  const tot=sum(Object.values(byType))||1;
  const hs=[]; for(let i=13;i>=0;i--){const d=addDays(DAY,-i); hs.push({d,v:hooper(d)});}
  const sleeps=[]; for(let i=6;i>=0;i--){const w=S.well[addDays(DAY,-i)]; if(w?.sleepH) sleeps.push(w.sleepH);}
  const hrvs=[]; for(let i=6;i>=0;i--){const w=S.well[addDays(DAY,-i)]; if(w?.hrv) hrvs.push(w.hrv);}

  return `
  <div class="card">
    <h2>Wochenlast · 7 Tage</h2>
    <div class="row between" style="margin-bottom:12px">
      <div><div class="big mono">${r0(ws.total)}</div><div class="xs muted">AU (sRPE)</div></div>
      <div style="text-align:right">
        <div class="mono" style="font-size:15px;font-weight:640;color:${Math.abs(diff)>30?'var(--amber)':'var(--muted)'}">
          ${prev.total?(diff>0?'+':'')+r0(diff)+' %':'—'}</div>
        <div class="xs muted">ggü. Vorwoche</div></div>
    </div>
    <svg class="chart" id="cLoad" viewBox="0 0 320 112" preserveAspectRatio="none"></svg>
    <div class="hr"></div>
    <div class="grid3">
      <div><div class="xs muted">Monotonie ${Q('mono')}</div>
        <div style="font-size:18px;font-weight:650" class="mono">${ws.mono?r1(ws.mono):'—'}</div>
        <div class="xs dim">${!ws.mono?'ab 3 Tagen':ws.mono>2?'hoch':'ok'}</div></div>
      <div><div class="xs muted">Strain</div>
        <div style="font-size:18px;font-weight:650" class="mono">${r0(ws.strain)}</div>
        <div class="xs dim">Last × Mono</div></div>
      <div><div class="xs muted">7:28 ${Q('acwr')}</div>
        <div style="font-size:18px;font-weight:650" class="mono">${rt?r1(rt):'—'}</div>
        <div class="xs dim">${rt?'nur Info':'ab 3 Wochen'}</div></div>
    </div>
    ${ws.mono>2?`<div class="warn">Monotonie über 2,0 — deine Tage sind sich zu ähnlich.
      Foster (1998) verband hohe Monotonie mit mehr Infekten und Stagnation.
      Ein echter Ruhetag senkt sie stärker als ein lockerer Tag.</div>`:''}
    <div class="note">7:28 ist bewusst ohne Ampel dargestellt. Die Acute:Chronic Workload Ratio
      gilt als Verletzungsprognose nicht als haltbar (Impellizzeri et al. 2020, Lolli et al. 2019) —
      als reines Bild deiner Belastungsverteilung ist sie brauchbar.</div>
  </div>

  <div class="card">
    <h2>Verteilung 7 Tage</h2>
    <div class="bar" style="height:12px;display:flex;gap:2px;background:none">
      <i style="width:${byType.handball/tot*100}%;background:var(--amber)"></i>
      <i style="width:${byType.gym/tot*100}%;background:var(--blue)"></i>
      <i style="width:${byType.other/tot*100}%;background:var(--violet)"></i>
    </div>
    <div class="row" style="gap:14px;margin-top:9px">
      <span class="xs"><span class="tag hb">HB</span> ${r0(byType.handball)} AU</span>
      <span class="xs"><span class="tag gym">GYM</span> ${r0(byType.gym)} AU</span>
      <span class="xs"><span class="tag other">DIV</span> ${r0(byType.other)} AU</span>
    </div>
  </div>

  <div class="card">
    <h2>Befinden · 14 Tage (niedrig = besser)</h2>
    <svg class="chart" id="cHoop" viewBox="0 0 320 112" preserveAspectRatio="none"></svg>
    <div class="hr"></div>
    <div class="grid3">
      <div><div class="xs muted">Hooper heute</div>
        <div style="font-size:18px;font-weight:650" class="mono">${hooper(DAY)??'—'}<span class="xs muted">/28</span></div></div>
      <div><div class="xs muted">Schlaf Ø 7 T</div>
        <div style="font-size:18px;font-weight:650" class="mono">${sleeps.length?r1(mean(sleeps))+' h':'—'}</div></div>
      <div><div class="xs muted">HRV Ø 7 T</div>
        <div style="font-size:18px;font-weight:650" class="mono">${hrvs.length?r0(mean(hrvs))+' ms':'—'}</div></div>
    </div>
    <div class="note">Der Wochenschnitt des rMSSD ist die belastbare Größe, nicht der Tageswert
      (Plews et al. 2013). Erfasse den Wert immer gleich — morgens, direkt nach dem Aufwachen.</div>
  </div>

  <div class="card">
    <h2>Was die Zahlen bedeuten</h2>
    <div class="small muted" style="line-height:1.6">
      <b style="color:var(--text)">sRPE</b> — RPE × Minuten. Macht eine Handballeinheit und ein
      Krafttraining auf einer Skala vergleichbar (Foster 1998).<br><br>
      <b style="color:var(--text)">Monotonie</b> — Wochenschnitt geteilt durch die Streuung der
      Tageslasten. Über 2,0 heißt: zu wenig Unterschied zwischen harten und leichten Tagen.<br><br>
      <b style="color:var(--text)">Bereitschaft</b> — kein Gesundheitswert, sondern die Abweichung
      deines Hooper-Index vom eigenen 14-Tage-Schnitt. Ab vier erfassten Tagen wird relativ
      gerechnet (Saw et al. 2016).
    </div>
  </div>`;
}

function drawCharts(){

  bars('cLoad', days.map(x=>x.v), days.map(x=>DOW[parseISO(x.d).getDay()]));
  const hs=[]; for(let i=13;i>=0;i--){const d=addDays(DAY,-i); hs.push(hooper(d));}

function bars(id,vals,labels){
  const el=document.getElementById(id); if(!el) return;
  const W=320,H=112,pb=16,mx=Math.max(...vals,1);
  const bw=W/vals.length;
  let s=`<line class="gl" x1="0" y1="${H-pb}" x2="${W}" y2="${H-pb}"/>`;
  vals.forEach((v,i)=>{
    const h=(v/mx)*(H-pb-8), x=i*bw+bw*0.18, w=bw*0.64;
    s+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(h,v>0?2:0)}" rx="2"
        fill="${i===vals.length-1?'var(--acc)':'var(--blue)'}" opacity="${v?1:.25}"/>`;
    if(i%2===1||i===vals.length-1)
      s+=`<text x="${i*bw+bw/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`;
  });
  el.innerHTML=s;
}
function line(id,vals,lo,hi){
  const el=document.getElementById(id); if(!el) return;
  const W=320,H=112,pb=14,pt=8;
  const pts=vals.map((v,i)=>v==null?null:
    [i/(vals.length-1)*W, pt+(1-(v-lo)/(hi-lo))*(H-pb-pt)]);
  let d='',started=false,s='';
  for(const p of pts){ if(!p){started=false;continue;}
    d+=(started?' L':' M')+p[0].toFixed(1)+' '+p[1].toFixed(1); started=true; }
  const good=pt+(1-(10-lo)/(hi-lo))*(H-pb-pt);
  s+=`<line class="gl" x1="0" y1="${good}" x2="${W}" y2="${good}" stroke-dasharray="3 4"/>`;
  s+=`<text x="2" y="${good-3}">gut</text>`;
  if(d) s+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{ if(p) s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--acc)"/>`; });
  if(!d) s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle">noch keine Daten</text>`;
  el.innerHTML=s;
}

      <label class="f"><span>Protein g/kg</span>
        <input type="number" step="0.1" value="${p.protPerKg}" onchange="setP('protPerKg',this.value)"></label>
      <label class="f"><span>Kohlenhydrate g/kg</span>
        <input type="number" step="0.5" value="${p.carbPerKg}" onchange="setP('carbPerKg',this.value)"></label>
    </div>
    <div class="hr"></div>
    <div class="small muted" style="line-height:1.7">
      Grundumsatz (Mifflin-St Jeor): <b class="mono" style="color:var(--text)">${r0(b)} kcal</b><br>
      Ziel ${human(DAY).toLowerCase()}: <b class="mono" style="color:var(--text)">${kt} kcal</b>
      · ${protTarget()} g Protein · ${carbTarget(DAY)} g KH · ${fatTarget(DAY)} g Fett
    </div>
    <div class="note">Protein 1,4–2,0 g/kg nach ISSN Position Stand (Jäger et al. 2017).
      Kohlenhydrate 5–7 g/kg für Mannschaftssport mit moderatem Umfang, an harten Tagen bis 8
      (ACSM/AND/DC Position Stand 2016). Trainingsenergie wird pro Einheit aus MET × kg × Stunden
      geschätzt und zu 55 % addiert, weil der PAL-Faktor einen Teil schon enthält.</div>
  </div>

  <div class="card">
    <h2>ADHS-Schicht</h2>
    <label class="f"><span>Einnahmezeit — der Anker für alle Essensfenster</span>
      <input type="time" value="${S.adhs.medTime}" onchange="setAdhs('medTime',this.value)"></label>
    <div class="chips" style="margin-bottom:12px">
      ${windowsFor(DAY).map(w=>`<span class="pill xs">${w.ico} ${m2hm(w.from)}–${m2hm(w.to)}</span>`).join('')}
    </div>
    <label class="f"><span>Essensfenster anzeigen</span>
      <select onchange="setAdhs('useWindows',this.value==='1')">
        <option value="1" ${S.adhs.useWindows?'selected':''}>ja</option>
        <option value="0" ${S.adhs.useWindows?'':'selected'}>nein</option>
      </select></label>
    <div class="note">Die Fenster liegen bei −20 min, +4 h, +7 h und +10 h ab Einnahme.
      Hintergrund ist der typische Wirkverlauf von Lisdexamfetamin: Wirkeintritt nach etwa
      einer Stunde, Spitze nach dreieinhalb bis viereinhalb Stunden, Nachlassen nach zehn bis
      zwölf Stunden. Der Appetit folgt diesem Verlauf — die Fenster legen das Essen dorthin,
      wo es sonst ausfällt. Das ist eine Struktur­hilfe, keine medizinische Empfehlung;
      Fragen zur Medikation gehören zu deiner Ärztin.</div>
  </div>

  ${S.foods.length?`<div class="card">
    <h2>Favoriten (${S.foods.length})</h2>
    ${S.foods.map((f,i)=>`<div class="item"><div class="g"><b>${esc(f.n)}</b>
      <span>${r0(f.kcal100)} kcal · ${r1(f.p)} P /100 g${f.bc?' · '+f.bc:''}</span></div>
      <button class="x" onclick="delFav(${i})">✕</button></div>`).join('')}
  </div>`:''}

  <div class="card">
    <h2>Daten</h2>
    <div class="small muted" style="margin-bottom:12px">
      Alles liegt ausschließlich in diesem Browser. Kein Server, kein Konto, keine Übertragung —
      nur die Produktabfrage geht an Open Food Facts. Wenn du den Browserspeicher löschst,
      sind die Daten weg. Deshalb: exportiere regelmäßig.</div>
    <div class="btnrow">
      <button class="btn" onclick="expo()">⬇ Export</button>
      <button class="btn" onclick="document.getElementById('impFile').click()">⬆ Import</button>
    </div>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="impo(this)">
    <div class="hr"></div>
    <div class="row between small">
      <span class="muted">Einheiten</span><b class="mono">${S.sessions.length}</b></div>
    <div class="row between small">
      <span class="muted">Tage mit Ernährung</span><b class="mono">${Object.keys(S.diary).length}</b></div>
    <div class="row between small">
      <span class="muted">Tage mit Check</span><b class="mono">${Object.keys(S.well).length}</b></div>
  </div>

  <div class="card">
    <h2>Quellen</h2>
    <div class="small muted" style="line-height:1.65">
      Nährwerte: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (ODbL).
      Rechenlogik nach Mifflin-St Jeor 1990, Foster 1998, Hooper &amp; Mackinnon 1995,
      Saw et al. 2016, Kellmann et al. 2018, Jäger et al. 2017 (ISSN),
      Thomas/Erdman/Burke 2016 (ACSM), Zourdos et al. 2016, Epley.
      Vollständige Liste in QUELLEN.md.</div>
    <div class="note">Diese App ersetzt keine sportmedizinische oder ernährungsmedizinische Beratung.
      Die Zielwerte sind Schätzungen aus Formeln, keine Messwerte.</div>
  </div>
  <div style="height:20px"></div>`;
}
window.setAdhs=(k,v)=>{ S.adhs[k]=v; save(); render(); };
window.setP=(k,v)=>{ S.profile[k]=(k==='sex'||k==='goal')?v:parseFloat(v); save();
  if(VIEW==='me') render(); };
window.delFav=i=>{ S.foods.splice(i,1); save(); render(); };
window.expo=()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='pivot-backup-'+todayISO()+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  S.seen.lastExport=Date.now(); save(); render(); toast('Export erstellt');
};
window.impo=inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.profile) throw 0;
      S=deepMerge(structuredClone(DEF),d); save(); render(); toast('Import erfolgreich'); }
    catch(e){ toast('Datei nicht lesbar'); } };
  r.readAsText(f); inp.value='';
};

/* =========================================================================
   START
   ========================================================================= */
if(S.seen.ver && S.seen.ver!==APP_VERSION) S.seen.updated=1;
if(S.seen.ver!==APP_VERSION){ S.seen.ver=APP_VERSION; save(); }
render();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopScan(); flush(); } });
</script>
</body>
</html>
